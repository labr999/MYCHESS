<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<!-- 選用：與本檔同資料夾若放有 coi-serviceworker.js，會自動取得跨來源隔離（COOP/COEP），
     讓「啟用 Pikafish 引擎」可用。檔案不存在時此行靜默略過，不影響其他功能。 -->
<script src="coi-serviceworker.js" onerror="window.__coiMissing=true"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>象棋開局譜</title>
<style>
  :root{
    --wood-dark:#5A3A22;
    --wood-mid:#7A4F2C;
    --wood-light:#9C6B3E;
    --felt:#E8D5A8;
    --felt-line:#3A2415;
    --gold:#C9A227;
    --gold-dim:#8C7018;
    --red-a:#C1443D;
    --red-b:#7E2A24;
    --red-text:#F7E7C9;
    --black-a:#3A3A38;
    --black-b:#141412;
    --black-text:#E4C874;
    --bg:#241811;
    --panel:#31221759;
    --cream:#F3E6C8;
    --muted:#C9B48A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:24px 12px 48px;
    background:
      radial-gradient(ellipse at top, #3a2818 0%, var(--bg) 60%);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    color:var(--cream);
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
  }
  h1{
    font-family:"Noto Serif TC",serif;
    font-weight:900;
    font-size:1.5rem;
    letter-spacing:.35em;
    color:var(--gold);
    margin:0 0 4px;
    text-align:center;
  }
  .subtitle{
    font-size:.75rem;
    color:var(--muted);
    letter-spacing:.15em;
    margin-bottom:20px;
    text-align:center;
  }
  .controls-top{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    margin-bottom:18px;
    background:var(--panel);
    padding:12px 16px;
    border:1px solid var(--gold-dim);
    border-radius:10px;
    backdrop-filter:blur(2px);
  }
  select{
    background:#4B2E1E;
    color:#FFFFFF;
    border:1px solid var(--gold-dim);
    border-radius:6px;
    padding:8px 12px;
    font-size:.85rem;
    min-width:150px;
    cursor:pointer;
    font-family:inherit;
  }
  select option{
    background:#4B2E1E;
    color:#FFFFFF;
  }
  .ctrl-group{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .ctrl-label{
    font-size:.7rem;
    color:var(--gold);
    letter-spacing:.1em;
  }
  .analysis-panel{
    width:100%;
    max-width:560px;
    margin-top:14px;
    background:var(--panel);
    border:1px solid var(--gold-dim);
    border-radius:10px;
    padding:12px 14px;
    display:none;
  }
  .analysis-panel.show{display:block;}
  .analysis-panel h3{
    margin:0 0 10px;
    font-size:.85rem;
    color:var(--gold);
    font-weight:700;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .pika-link{
    font-size:.72rem;
    color:#1a1204;
    background:var(--gold);
    padding:3px 10px;
    border-radius:5px;
    text-decoration:none;
    font-weight:700;
  }
  .engine-note{font-size:.66rem;color:var(--muted);font-weight:400;}
  .eval-bar-wrap{
    width:100%;
    height:16px;
    border-radius:8px;
    background:linear-gradient(180deg,#141412,#2a2a28);
    border:1px solid var(--gold-dim);
    overflow:hidden;
    margin-bottom:6px;
  }
  .eval-bar{
    height:100%;
    width:50%;
    background:linear-gradient(180deg,#D6584F,#7E2A24);
    transition:width .4s ease;
  }
  .eval-text{
    font-size:.8rem;
    color:var(--cream);
    margin-bottom:10px;
    text-align:center;
  }
  .best-move{
    display:flex;
    align-items:center;
    gap:10px;
    background:#00000030;
    border:1px solid var(--gold-dim);
    border-radius:6px;
    padding:7px 12px;
    margin-bottom:6px;
    font-size:.82rem;
    cursor:pointer;
  }
  .best-move:hover{border-color:var(--gold);background:#00000050;}
  .bm-rank{
    color:#1a1204;
    background:var(--gold);
    border-radius:4px;
    width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:.75rem;
    flex-shrink:0;
  }
  .bm-move{color:var(--gold);font-weight:700;min-width:80px;}
  .bm-score{color:var(--muted);font-size:.74rem;}
  select:focus{outline:2px solid var(--gold);}
  .board-wrap{
    position:relative;
    padding:18px;
    background:
      linear-gradient(145deg,var(--wood-light),var(--wood-dark) 60%,var(--wood-mid));
    border-radius:14px;
    box-shadow:0 12px 30px rgba(0,0,0,.55), inset 0 0 0 2px #00000033;
  }
  .stud{
    position:absolute;
    width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#E8C766,#8C6A1E 70%,#5c4210);
    box-shadow:0 1px 2px rgba(0,0,0,.6);
  }
  .stud.tl{top:8px;left:8px;} .stud.tr{top:8px;right:8px;}
  .stud.bl{bottom:8px;left:8px;} .stud.br{bottom:8px;right:8px;}
  svg#board{display:block;width:100%;max-width:520px;height:auto;}
  .strip{
    width:100%;
    max-width:560px;
    margin-top:16px;
    background:var(--panel);
    border:1px solid var(--gold-dim);
    border-radius:10px;
    padding:12px 14px;
  }
  .moves{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:10px;
    min-height:28px;
  }
  .move-chip{
    font-size:.78rem;
    padding:4px 9px;
    border-radius:5px;
    background:#00000030;
    border:1px solid var(--gold-dim);
    color:var(--muted);
    cursor:pointer;
    white-space:nowrap;
  }
  .move-chip.active{
    background:var(--gold-dim);
    color:#1a1204;
    font-weight:700;
    border-color:var(--gold);
  }
  .transport{
    display:flex;
    align-items:center;
    gap:8px;
    justify-content:center;
    width:100%;
    max-width:560px;
    margin-top:12px;
    background:var(--panel);
    border:1px solid var(--gold-dim);
    border-radius:10px;
    padding:10px 14px;
    backdrop-filter:blur(2px);
  }
  .transport button{
    background:linear-gradient(180deg,#4A3018,#2E1D0E);
    color:var(--gold);
    border:1px solid var(--gold-dim);
    border-radius:6px;
    width:38px;height:34px;
    font-size:1rem;
    cursor:pointer;
  }
  .transport button:hover{border-color:var(--gold);}
  .step-label{font-size:.78rem;color:var(--muted);min-width:70px;text-align:center;}
  .desc{
    font-size:.82rem;
    line-height:1.6;
    color:var(--cream);
    border-top:1px solid var(--gold-dim);
    padding-top:10px;
    margin-top:4px;
  }
  .desc b{color:var(--gold);}
  .rec-bar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:10px;
    padding-bottom:10px;
    border-bottom:1px solid var(--gold-dim);
  }
  .rec-bar button{
    background:linear-gradient(180deg,#4A3018,#2E1D0E);
    color:var(--cream);
    border:1px solid var(--gold-dim);
    border-radius:6px;
    padding:7px 14px;
    font-size:.8rem;
    cursor:pointer;
    font-family:inherit;
  }
  .rec-bar button:hover{border-color:var(--gold);}
  .rec-bar button.recording{
    background:var(--red-b);
    color:#fff;
    border-color:var(--red-a);
    font-weight:700;
  }
  .search-results{
    margin-top:10px;
    display:none;
  }
  .search-results.show{display:block;}
  .sr-item{
    display:block;
    width:100%;
    text-align:left;
    background:#00000030;
    border:1px solid var(--gold-dim);
    border-radius:6px;
    padding:8px 12px;
    margin-bottom:6px;
    color:var(--cream);
    font-size:.8rem;
    cursor:pointer;
    font-family:inherit;
    line-height:1.5;
  }
  .sr-item:hover{border-color:var(--gold);background:#00000050;}
  .sr-item .sr-cat{color:var(--gold);font-weight:700;}
  .sr-item .sr-why{color:var(--muted);font-size:.72rem;}
  .sr-yt{
    display:inline-block;
    font-size:.7rem;
    color:#1a1204;
    background:var(--gold);
    padding:2px 9px;
    border-radius:5px;
    text-decoration:none;
    font-weight:700;
    margin-left:6px;
  }
  .sr-yt:hover{background:#E8C766;}
  .sr-empty{font-size:.78rem;color:var(--muted);padding:6px 0;}
  .import-panel{
    display:none;
    margin-bottom:12px;
    padding:12px;
    background:#00000030;
    border:1px solid var(--gold-dim);
    border-radius:8px;
  }
  .import-panel.show{display:block;}
  .import-panel input[type=text], .import-panel textarea{
    width:100%;
    box-sizing:border-box;
    background:#1d120a;
    color:var(--cream);
    border:1px solid var(--gold-dim);
    border-radius:6px;
    padding:8px 10px;
    font-size:.8rem;
    font-family:inherit;
    margin-bottom:8px;
    resize:vertical;
  }
  .import-panel input:focus, .import-panel textarea:focus{outline:1px solid var(--gold);}
  .imp-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .imp-row select{min-width:180px;}
  .imp-row button{
    background:linear-gradient(180deg,#4A3018,#2E1D0E);
    color:var(--gold);
    border:1px solid var(--gold-dim);
    border-radius:6px;
    padding:8px 14px;
    font-size:.8rem;
    cursor:pointer;
    font-family:inherit;
  }
  .imp-row button:hover{border-color:var(--gold);}
  .imp-msg{font-size:.76rem;color:var(--muted);margin-top:8px;line-height:1.6;}
  .imp-msg.ok{color:#8FD98F;}
  .imp-msg.err{color:#E08080;}
  .links{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:10px;
  }
  .links a{
    font-size:.76rem;
    color:#1a1204;
    background:var(--gold);
    padding:6px 12px;
    border-radius:6px;
    text-decoration:none;
    font-weight:700;
  }
  .links a.secondary{
    background:transparent;
    color:var(--gold);
    border:1px solid var(--gold-dim);
    font-weight:400;
  }
  .note{
    font-size:.72rem;
    color:var(--muted);
    text-align:center;
    max-width:560px;
    margin-top:14px;
    line-height:1.6;
  }
</style>
</head>
<body>

<h1>象 棋 開 局 譜</h1>
<div class="subtitle">棋盤棋子擺設參考：<a href="https://youtu.be/ZdLDNyK8UPY" target="_blank" style="color:var(--gold);">吾愛象棋教學參考影片</a></div>

<div class="controls-top">
  <div class="ctrl-group">
    <label class="ctrl-label">先手／後手</label>
    <select id="sideSelect"></select>
  </div>
  <div class="ctrl-group">
    <label class="ctrl-label">開局分類（含棋譜／影片）</label>
    <select id="categorySelect"></select>
  </div>
  <div class="ctrl-group">
    <label class="ctrl-label">棋子樣式</label>
    <select id="themeSelect"></select>
  </div>
</div>

<div class="board-wrap">
  <div class="stud tl"></div><div class="stud tr"></div><div class="stud bl"></div><div class="stud br"></div>
  <svg id="board" viewBox="0 0 544 642" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<div class="transport">
  <button id="btnFirst" title="回到開局">|&laquo;</button>
  <button id="btnPrev" title="上一步">&laquo;</button>
  <button id="btnPlay" title="自動播放">&#9654;</button>
  <button id="btnNext" title="下一步">&raquo;</button>
  <button id="btnLast" title="跳到最後">&raquo;|</button>
  <span class="step-label" id="stepLabel">0 / 0</span>
</div>
<div id="checkBanner" style="display:none;text-align:center;margin:6px auto 0;max-width:560px;padding:7px 12px;border-radius:8px;font-weight:800;font-size:.88rem;letter-spacing:.12em;"></div>
<div id="openingReco" style="display:none;text-align:center;margin:6px auto 0;max-width:560px;padding:5px 12px;border-radius:8px;background:rgba(201,162,39,.12);border:1px solid rgba(201,162,39,.4);color:#E8CD7A;font-size:.76rem;"></div>
<div id="extLibNote" style="display:none;text-align:center;margin:6px auto 0;max-width:560px;padding:5px 12px;border-radius:8px;background:rgba(90,150,120,.14);border:1px solid rgba(120,200,160,.35);color:#A8E0C0;font-size:.72rem;"></div>

<div class="analysis-panel" id="analysisPanel">
  <h3>⚡ 即時局勢分析
    <a href="https://github.com/official-pikafish/Pikafish/releases" target="_blank" class="pika-link">下載 Pikafish 引擎</a>
    <span class="engine-note">四層分析：內建引擎（即時保底）→ 雲庫（chessdb）→ 內嵌 Pikafish 引擎（最強，可啟用）→ 皮卡魚網頁版</span>
  </h3>
  <div class="eval-bar-wrap"><div class="eval-bar" id="evalBar"></div></div>
  <div class="eval-text" id="evalText">開始記譜後將即時顯示雙方局勢評分</div>
  <div id="evalCurveWrap" style="display:none;margin-top:8px;">
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:.66rem;color:#C9B48A;margin-bottom:3px;">
      <span>形勢曲線（紅上黑下，點擊可跳至該步）</span><span id="curveNote"></span>
    </div>
    <svg id="evalCurve" viewBox="0 0 300 64" preserveAspectRatio="none" style="width:100%;height:64px;display:block;border-radius:8px;background:rgba(0,0,0,.22);border:1px solid rgba(201,162,39,.28);cursor:pointer;"></svg>
  </div>
  <div id="bestMoves"></div>
  <div id="pvLine" style="display:none;margin-top:6px;padding:6px 10px;border-radius:8px;background:rgba(80,140,180,.12);border:1px solid rgba(120,180,220,.3);font-size:.74rem;line-height:1.6;color:#CDE6F5;"></div>
  <div id="coachStats" style="display:none;margin-top:6px;padding:5px 10px;border-radius:8px;background:rgba(201,162,39,.10);border:1px solid rgba(201,162,39,.30);font-size:.72rem;color:#E8CD7A;"></div>
  <div id="coachMsg" style="display:none;margin-top:8px;padding:7px 12px;border-radius:8px;background:rgba(0,0,0,.25);border:1px solid #C9A227;font-size:.8rem;"></div>
  <div style="margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
    <label style="display:flex;align-items:center;gap:6px;font-size:.76rem;color:#E8CD7A;cursor:pointer;">
      <input type="checkbox" id="chkSpeak" style="cursor:pointer;"> 🔊 語音提示
    </label>
    <label style="display:flex;align-items:center;gap:5px;font-size:.7rem;color:#C9B48A;">
      語速 <input type="range" id="rngRate" min="0.6" max="1.6" step="0.1" value="1" style="width:88px;cursor:pointer;">
      <span id="rateVal">1.0×</span>
    </label>
    <button id="btnSpeakTest" style="background:rgba(201,162,39,.18);color:#E8CD7A;border:1px solid rgba(201,162,39,.5);border-radius:7px;padding:4px 10px;font-size:.7rem;cursor:pointer;font-family:inherit;">試聽</button>
    <span id="speakHint" style="font-size:.66rem;color:#C9B48A;"></span>
  </div>
  <div style="margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
    <button id="btnPikaEngine" style="background:linear-gradient(180deg,#1f7a5a,#124a37);color:#EAFFF6;border:1px solid #4FC79A;border-radius:8px;padding:7px 14px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:inherit;">🐟 啟用 Pikafish 引擎（最強）</button>
    <span id="pikaEngineHint" style="font-size:.68rem;color:#C9B48A;">點擊載入約 1.6MB 引擎，之後每步用真實 Pikafish 分析</span>
  </div>
  <div style="margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
    <button id="btnPikaWeb" style="background:linear-gradient(180deg,#2c6e8f,#1a4a63);color:#EAF6FF;border:1px solid #4FA3C7;border-radius:8px;padding:7px 14px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:inherit;">🐟 皮卡魚網頁版深度分析此局面</button>
    <span id="pikaHint" style="font-size:.68rem;color:#C9B48A;"></span>
  </div>
</div>

<div class="strip">
  <div class="rec-bar">
    <button id="btnRecRed">✎ 先手記譜</button>
    <button id="btnRecBlack">✎ 後手記譜</button>
    <button id="btnUndo">悔棋</button>
    <button id="btnClearRec">清空</button>
    <button id="btnSaveRec">💾 儲存棋譜</button>
    <button id="btnRecHistory">🕘 記譜歷史</button>
    <button id="btnSearchOpen">🔍 搜尋此局面的開局影片</button>
    <button id="btnImport">📋 匯入棋譜</button>
    <button id="btnMaster">🏆 大師棋庫</button>
    <button id="btnExport">📤 匯出棋譜</button>
  </div>
  <div class="import-panel" id="exportPanel">
    <div class="imp-row">
      <select id="expFormat">
        <option value="cn">中文記譜</option>
        <option value="wxf">WXF／PlayOK 西式記譜</option>
        <option value="iccs">ICCS／UCI 座標</option>
        <option value="fen">FEN（當前局面）</option>
        <option value="json">JSON（含著法）</option>
      </select>
      <button id="btnCopyExport">複製</button>
      <button id="btnCancelExport">關閉</button>
    </div>
    <textarea id="expText" rows="5" readonly style="width:100%;box-sizing:border-box;"></textarea>
  </div>
  <div class="import-panel" id="importPanel">
    <input type="text" id="impName" placeholder="棋譜名稱（可留空，自動命名）">
    <textarea id="impText" rows="5" placeholder="貼上棋譜文字，自動偵測格式：&#10;・中文記譜：1.炮二平五 馬2進3 …（簡繁體皆可）&#10;・PlayOK／WXF：1. C2.5 h2+3 2. H2+3 p7+1 …&#10;・ICCS 座標：H2-E2 h9g7 …&#10;・東萍 DhtmlXQ 原始碼（含 [DhtmlXQ_movelist]）&#10;含回合數字、標頭或標點都可以，會自動過濾。"></textarea>
    <div class="imp-row">
      <select id="impCategory"><option value="auto">🤖 自動分類</option></select>
      <button id="btnDoImport">匯入並分類</button>
      <button id="btnCancelImport">取消</button>
    </div>
    <div class="imp-msg" id="impMsg"></div>
  </div>
  <div class="search-results" id="searchResults"></div>
  <div class="import-panel" id="masterPanel">
    <div class="imp-row">
      <input type="text" id="mstQuery" placeholder="搜尋棋手、賽事或年份，例如：王天一、亞錦賽、2026" style="flex:1;min-width:180px;">
      <button id="btnMstSearch">搜尋</button>
      <button id="btnCancelMaster">關閉</button>
    </div>
    <div class="imp-msg" id="mstMsg"></div>
    <div id="mstQuick" style="display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 8px;"></div>
    <div id="mstResults" style="max-height:280px;overflow-y:auto;"></div>
  </div>
  <div class="moves" id="movesList"></div>
  <div class="desc" id="descBox"></div>
  <div class="links">
    <a id="videoLink" href="#" target="_blank">教學影片搜尋</a>
    <a id="sourceLink" class="secondary" href="#" target="_blank">棋盤擺設參考影片</a>
  </div>
</div>

<div class="note" id="footNote"></div>

<script>
/* ---------- 棋盤座標系統 ---------- */
const MARGIN=40, CELL=58, RIVER_GAP=40;
function X(col){return MARGIN+col*CELL;}
function Y(row){return MARGIN+row*CELL+(row>4?RIVER_GAP:0);}

/* ---------- 初始擺子 ---------- */
function initialPieces(){
  return [
    {side:'b',type:'車',col:0,row:0},{side:'b',type:'馬',col:1,row:0},{side:'b',type:'象',col:2,row:0},
    {side:'b',type:'士',col:3,row:0},{side:'b',type:'將',col:4,row:0},{side:'b',type:'士',col:5,row:0},
    {side:'b',type:'象',col:6,row:0},{side:'b',type:'馬',col:7,row:0},{side:'b',type:'車',col:8,row:0},
    {side:'b',type:'砲',col:1,row:2},{side:'b',type:'砲',col:7,row:2},
    {side:'b',type:'卒',col:0,row:3},{side:'b',type:'卒',col:2,row:3},{side:'b',type:'卒',col:4,row:3},

/* ---------- 中文記譜自動解析引擎 ---------- */
function pieceCategory(ch){
  if(ch==='車'||ch==='车') return 'R';
  if(ch==='馬'||ch==='马') return 'H';
  if(ch==='砲'||ch==='炮') return 'C';
  if(ch==='相'||ch==='象') return 'E';
  if(ch==='仕'||ch==='士') return 'A';
  if(ch==='帥'||ch==='帅'||ch==='將'||ch==='将') return 'K';
  if(ch==='兵'||ch==='卒') return 'P';
  return null;
}
function numFromChar(ch){
  const cn={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,
            '１':1,'２':2,'３':3,'４':4,'５':5,'６':6,'７':7,'８':8,'９':9};
  if(cn[ch]!==undefined) return cn[ch];
  if(/[0-9]/.test(ch)) return parseInt(ch,10);
  return null;
}
function sideColToScreen(side,n){ return side==='r' ? 9-n : n-1; }

/* ---------- 完整走法規則檢查（自足式，解析／記譜／將軍偵測共用） ---------- */
function pieceAtXQ(alive, c, r){ return alive.find(p=>p.col===c && p.row===r) || null; }
function isLegalMoveXQ(alive, side, from, to){
  const [fc,fr]=from, [tc,tr]=to;
  if(tc<0||tc>8||tr<0||tr>9) return false;
  const mover = pieceAtXQ(alive, fc, fr);
  if(!mover || mover.side!==side) return false;
  const dst = pieceAtXQ(alive, tc, tr);
  if(dst && dst.side===side) return false;
  const cat = pieceCategory(mover.type);
  const dc=tc-fc, dr=tr-fr, adc=Math.abs(dc), adr=Math.abs(dr);
  const between = ()=>{
    let n=0;
    if(dr===0){ for(let c=Math.min(fc,tc)+1;c<Math.max(fc,tc);c++) if(pieceAtXQ(alive,c,fr)) n++; }
    else if(dc===0){ for(let r=Math.min(fr,tr)+1;r<Math.max(fr,tr);r++) if(pieceAtXQ(alive,fc,r)) n++; }
    else return -1;
    return n;
  };
  const palace = (c,r)=> c>=3&&c<=5 && (side==='r' ? r>=7&&r<=9 : r>=0&&r<=2);
  switch(cat){
    case 'R': return (dc===0||dr===0) && between()===0;
    case 'C': { if(dc!==0&&dr!==0) return false; const n=between(); return dst ? n===1 : n===0; }
    case 'H': {
      if(!((adc===1&&adr===2)||(adc===2&&adr===1))) return false;
      return !pieceAtXQ(alive, fc+(adc===2?dc/2:0), fr+(adr===2?dr/2:0));   // 蹩馬腿
    }
    case 'E': {
      if(adc!==2||adr!==2) return false;
      if(pieceAtXQ(alive, fc+dc/2, fr+dr/2)) return false;                   // 塞象眼
      return side==='r' ? tr>=5 : tr<=4;                                     // 不過河
    }
    case 'A': return adc===1 && adr===1 && palace(tc,tr);
    case 'K': return adc+adr===1 && palace(tc,tr);
    case 'P': {
      const fw = side==='r' ? -1 : 1;
      const crossed = side==='r' ? fr<=4 : fr>=5;
      if(dc===0 && dr===fw) return true;
      return crossed && dr===0 && adc===1;
    }
  }
  return false;
}
function kingsFacingXQ(alive){
  const rk=alive.find(p=>p.side==='r'&&pieceCategory(p.type)==='K');
  const bk=alive.find(p=>p.side==='b'&&pieceCategory(p.type)==='K');
  if(!rk||!bk||rk.col!==bk.col) return false;
  for(let r=Math.min(rk.row,bk.row)+1;r<Math.max(rk.row,bk.row);r++)
    if(pieceAtXQ(alive,rk.col,r)) return false;
  return true;
}
function isInCheckXQ(alive, side){
  const king=alive.find(p=>p.side===side&&pieceCategory(p.type)==='K');
  if(!king) return false;
  if(kingsFacingXQ(alive)) return true;   // 將帥照面視同被將
  const opp = side==='r'?'b':'r';
  return alive.some(p=>p.side===opp && isLegalMoveXQ(alive, opp, [p.col,p.row], [king.col,king.row]));
}
/* 回傳 null / 'check' / 'mate'（含逐一模擬解將） */
function checkStatusXQ(alive, side){
  if(!isInCheckXQ(alive, side)) return null;
  for(const p of alive.filter(q=>q.side===side)){
    for(let c=0;c<9;c++)for(let r=0;r<10;r++){
      if(!isLegalMoveXQ(alive, side, [p.col,p.row], [c,r])) continue;
      const sim = alive.filter(q=>!(q.col===c&&q.row===r&&q.side!==side)).map(q=>({...q}));
      const sm = sim.find(q=>q.col===p.col&&q.row===p.row);
      sm.col=c; sm.row=r;
      if(!isInCheckXQ(sim, side)) return 'check';
    }
  }
  return 'mate';
}

function parseToken(str){
  const chars=Array.from(str);
  let i=0, prefix=null;
  if(chars[0]==='前'||chars[0]==='后'||chars[0]==='後'||chars[0]==='中'){ prefix=chars[0]; i=1; }
  const pieceChar=chars[i]; i++;
  const category=pieceCategory(pieceChar);
  let col=null;
  if(!prefix){ col=numFromChar(chars[i]); i++; }
  const action=chars[i]; i++;
  const target=numFromChar(chars[i]); i++;
  return {prefix,category,col,action,target};
}

function computeDestForPiece(piece, side, category, action, target){
  const fromCol=piece.col, fromRow=piece.row;
  let toCol, toRow;
  if(category==='R'||category==='C'||category==='P'||category==='K'){
    if(action==='平'){ toCol=sideColToScreen(side,target); toRow=fromRow; }
    else{
      toCol=fromCol;
      const dir=(action==='进'||action==='進') ? (side==='r'?-1:1) : (side==='r'?1:-1);
      toRow=fromRow+dir*target;
    }
  } else {
    toCol=sideColToScreen(side,target);
    const colDelta=Math.abs(toCol-fromCol);
    let rowDelta;
    if(category==='H') rowDelta=(colDelta===1)?2:1;
    else if(category==='E') rowDelta=2;
    else rowDelta=1;
    const dir=(action==='进'||action==='進') ? (side==='r'?-1:1) : (side==='r'?1:-1);
    toRow=fromRow+dir*rowDelta;
  }
  return [toCol,toRow];
}

/* 嚴格解析：每顆候選棋子模擬走步 → 完整規則驗證 → 前中後選取 */
function resolveNotationStrict(state, side, tk){
  const {prefix,category,col,action,target}=tk;
  if(!category || target===null) return null;
  const alive = state.filter(p=>p.alive);
  let cands = alive.filter(p=>p.side===side && pieceCategory(p.type)===category);
  if(col!==null){
    const sc = sideColToScreen(side,col);
    const onCol = cands.filter(p=>p.col===sc);
    if(onCol.length) cands = onCol;
  }
  const isAdv=(action==='進'||action==='进');
  const isFlat=(action==='平');
  const fwd = side==='r' ? -1 : 1;
  const matches=[];
  for(const p of cands){
    const targets=[];
    if(isFlat) targets.push([sideColToScreen(side,target), p.row]);
    else{
      const dir = isAdv ? fwd : -fwd;
      if(category==='R'||category==='C'||category==='K'||category==='P') targets.push([p.col, p.row+dir*target]);
      else{
        const tc = sideColToScreen(side,target);
        const steps = category==='H' ? [1,2] : category==='E' ? [2] : [1];
        for(const s of steps) targets.push([tc, p.row+dir*s]);
      }
    }
    for(const t of targets){
      if(isLegalMoveXQ(alive, side, [p.col,p.row], t)) matches.push({piece:p, to:t});
    }
  }
  if(!matches.length) return null;
  matches.sort((a,b2)=> side==='r' ? a.piece.row-b2.piece.row : b2.piece.row-a.piece.row);  // 前在先
  if(prefix==='前') return matches[0];
  if(prefix==='后'||prefix==='後') return matches[matches.length-1];
  if(prefix==='中') return matches[Math.min(1, matches.length-1)];
  return matches[0];
}

function applyNotation(state, side, str){
  const tk=parseToken(str);
  const strict=resolveNotationStrict(state, side, tk);
  if(strict){
    const piece=strict.piece, toCol=strict.to[0], toRow=strict.to[1];
    const fromCol=piece.col, fromRow=piece.row;
    const captured = state.find(p=>p.alive && p.side!==side && p.col===toCol && p.row===toRow);
    if(captured) captured.alive=false;
    piece.col=toCol; piece.row=toRow;
    return {from:[fromCol,fromRow], to:[toCol,toRow]};
  }
  /* 嚴格解析找不到合法著法 → 直接報錯，避免壞資料靜默混入棋庫 */
  throw new Error('「'+str+'」不是此局面的合法著法（可能是路數寫錯、該子被阻擋，或棋譜順序有誤）');
}

function buildMovesFromNotation(list){
  const state = initialPieces().map(p=>({...p,alive:true,initRow:p.row,initCol:p.col}));
  return list.map((str,i)=>{
    const side=(i%2===0)?'r':'b';
    const {from,to}=applyNotation(state, side, str);
    return {from,to,notation:str};
  });
}

function demoFromNotation(name, desc, list){
  return { name, desc, moves: buildMovesFromNotation(list) };
}

/* ---------- 下拉選單初始化 ---------- */
const sideSelect = document.getElementById('sideSelect');
const categorySelect = document.getElementById('categorySelect');

Object.keys(DATA).forEach(side=>{
  const opt=document.createElement('option');
  opt.value=side; opt.textContent = side==="先手" ? "先手（紅方中炮開局）" : "後手（黑方中炮應局）";
  sideSelect.appendChild(opt);
});

function lineTag(line){
  if(line.moves && line.moves.length>0) return '【文字棋譜】';
  if(line.playlistId) return '【播放清單】';
  if(line.videoUrl) return '【影片】';
  return '【未收錄】';
}

function populateCategories(){
  categorySelect.innerHTML='';
  const side = sideSelect.value;
  const isMaster = c => !!AppState.library.masterCats[side+'|'+c];
  const isTextLine  = l => l.moves && l.moves.length>0;
  const isMediaLine = l => !!(l.playlistId || l.videoUrl);

  const addHeader = (label)=>{
    const o=document.createElement('option');
    o.disabled=true; o.textContent=label;
    categorySelect.appendChild(o);
  };
  /* 將某分類中符合條件的行加入選單（value 沿用原始行索引，播放邏輯不變） */
  const addSection = (cat, pick, mk)=>{
    const entry = DATA[side][cat];
    const rows = entry.lines.map((l,i)=>({l,i})).filter(x=>pick(x.l));
    if(!rows.length) return false;
    if(rows.length===1){
      const opt=document.createElement('option');
      opt.value=cat+'||'+rows[0].i;
      opt.textContent=(mk||'')+cat+' '+lineTag(rows[0].l);
      categorySelect.appendChild(opt);
    } else {
      const grp=document.createElement('optgroup');
      grp.label=(mk||'')+cat;
      rows.forEach(x=>{
        const opt=document.createElement('option');
        opt.value=cat+'||'+x.i;
        opt.textContent='　'+x.l.name+' '+lineTag(x.l);
        grp.appendChild(opt);
      });
      categorySelect.appendChild(grp);
    }
    return true;
  };

  const all = Object.keys(DATA[side]);
  const opening = all.filter(c=>!isMaster(c));
  const masters = all.filter(isMaster);

  /* 📖 文字棋譜（含記譜歷史）→ 🎬 影音教學 → 🏆 大師棋庫 */
  const hasText = opening.some(c=>DATA[side][c].lines.some(isTextLine));
  if(hasText){
    addHeader('────── 📖 文字棋譜 ──────');
    opening.forEach(c=>addSection(c, isTextLine, ''));
  }
  const hasMedia = opening.some(c=>DATA[side][c].lines.some(isMediaLine));
  if(hasMedia){
    addHeader('────── 🎬 影音教學 ──────');
    opening.forEach(c=>addSection(c, isMediaLine, ''));
  }
  if(masters.length){
    addHeader('────── 🏆 大師棋庫 ──────');
    masters.forEach(c=>addSection(c, ()=>true, '🏆 '));
  }
  /* 跳過開頭的分隔行，預設選到第一個可用項 */
  const first = Array.from(categorySelect.querySelectorAll('option')).find(o=>!o.disabled);
  if(first) categorySelect.value = first.value;
  applySelection();
}

function applySelection(){
  if(AppState.rec.on) stopRecording();   // 記譜中選取分類：自動結束記譜，避免文字棋譜點了沒反應
  const v = categorySelect.value;
  const sep = v.lastIndexOf('||');
  if(sep < 0) return;              // 棋庫尚未載入完成：暫不套用
  AppState.nav.cat = v.substring(0, sep);
  AppState.nav.idx = parseInt(v.substring(sep+2), 10) || 0;
  loadLine();
}

function selectCategory(cat, idx){
  categorySelect.value = cat+'||'+(idx||0);
  applySelection();
}

function loadLine(){
  const side=sideSelect.value, cat=AppState.nav.cat, idx=AppState.nav.idx;
  const entry = DATA[side][cat];
  if(!entry) return;
  const line = entry.lines[idx];
  AppState.nav.moves = line.moves;
  AppState.nav.index = 0;
  if(!AppState.rec.on) AppState.rec.flip = (side==='後手');   // 後手棋譜以黑子在下方視角展示
  document.getElementById('descBox').innerHTML =
    '<b>'+cat+'</b><br>'+entry.intro + '<br><br>'+line.desc;
  const videoLinkEl = document.getElementById('videoLink');
  if(line.playlistId){
    videoLinkEl.href = 'https://www.youtube.com/playlist?list='+line.playlistId;
    videoLinkEl.textContent = '▶ 在 YouTube 開啟播放清單';
  } else if(line.videoUrl){
    videoLinkEl.href = line.videoUrl;
    videoLinkEl.textContent = '▶ 在 YouTube 觀看影片';
  } else {
    const q = encodeURIComponent('吾愛象棋教學 '+cat+' '+line.name);
    videoLinkEl.href = 'https://www.youtube.com/results?search_query='+q;
    videoLinkEl.textContent = '教學影片搜尋';
  }
  document.getElementById('sourceLink').href = 'https://youtu.be/ZdLDNyK8UPY';
  document.getElementById('analysisPanel').classList.toggle('show', AppState.nav.moves.length>0);   // 有文字棋譜即顯示分析面板
  renderMovesList();
  renderBoard();
}

function contentTag(entry){
  const hasMoves = entry.lines.some(l=>l.moves && l.moves.length>0);
  const hasVideo = entry.lines.some(l=>l.videoUrl);
  const hasList = entry.lines.some(l=>l.playlistId);
  if(hasMoves && (hasVideo||hasList)) return '【棋譜＋影片】';
  if(hasList) return '【播放清單】';
  if(hasMoves) return '【文字棋譜】';
  if(hasVideo) return '【影片】';
  return '【未收錄】';
}

function drawBoardGrid(){

  html += `<text x="${(X(6)+X(8))/2}" y="${(Y(4)+Y(5))/2+8}" font-size="26" fill="#5A4020" font-family='"Noto Serif TC",serif' text-anchor="middle" letter-spacing="4">漢 界</text>`;
  return html;

function computeBoardAt(index, movesArr){
  const src = movesArr || AppState.nav.moves;
  const pieces = initialPieces().map(p=>({...p, alive:true}));
  for(let i=0;i<index;i++){
    const mv = src[i];
    const [fc,fr]=mv.from, [tc,tr]=mv.to;
    const mover = pieces.find(p=>p.alive && p.col===fc && p.row===fr);
    if(!mover) continue;
    const captured = pieces.find(p=>p.alive && p.col===tc && p.row===tr);
    if(captured) captured.alive=false;
    mover.col=tc; mover.row=tr;
  }
  return pieces.filter(p=>p.alive);
}

/* ==================== 棋盤繪製（拆分為六個職責單一的函式） ====================
   renderBoard()  總調度：取得目前局面 → 依序呼叫下列各函式
     ├ renderGrid()        棋盤格線、九宮、河界（drawBoardGrid 產生）
     ├ renderAnnotations() 標記：最後一步光圈、記譜選取框
     ├ renderPieces()      棋子本體（含主題配色與文字描邊）
     ├ buildCaptureGhost() 吃子殘影（僅前進一步且有吃子時產生）
     ├ triggerAnimations() 動畫：走子滑移、殘影淡出、光圈閃爍
     ├ updateStatus()      將軍／絕殺橫幅與語音播報
     └ updateAnalysis()    開局辨識、形勢曲線、引擎分析觸發              */

/* 取得目前要繪製的局面上下文，供各繪製函式共用 */
function getRenderContext(){
  const rec = AppState.rec.on;
  const movesArr = rec ? AppState.rec.moves : AppState.nav.moves;
  const idx = rec ? AppState.rec.moves.length : AppState.nav.index;
  return {
    rec, movesArr, idx,
    pieces: computeBoardAt(idx, movesArr),
    last: idx>0 ? movesArr[idx-1] : null,
    theme: PIECE_THEMES[AppState.render.theme] || PIECE_THEMES.classic,
    /* 是否為「往前走一步」——只有這種情況才播放動畫（跳步／倒退不播） */
    stepForward: idx>0 && AppState.render.prevIdx===idx-1
                 && AppState.render.prevMode===(rec?'rec':'play')
  };
}

/* ---- 棋盤格線 ---- */
function renderGrid(){
  return drawBoardGrid();
}

/* ---- 標記：最後一步光圈、記譜選取框 ---- */
function renderAnnotations(ctx){
  let html='';
  if(ctx.last){
    html += `<circle id="lastRing" cx="${X(dC(ctx.last.to[0]))}" cy="${Y(dR(ctx.last.to[1]))}" r="27" fill="none" stroke="#C9A227" stroke-width="2.5" opacity="0.85"/>`;
  }
  if(ctx.rec && AppState.rec.selected){
    html += `<circle cx="${X(dC(AppState.rec.selected[0]))}" cy="${Y(dR(AppState.rec.selected[1]))}" r="28" fill="none" stroke="#6FCF6F" stroke-width="3"/>`;
  }
  return html;
}

/* ---- 單顆棋子（棋子本體與殘影共用，確保外觀一致） ---- */
function pieceSvg(p, cx, cy, theme, extraAttr){
  const isRed = p.side==='r';
  const textC = isRed ? theme.rt : theme.bt;
  const ringC = isRed ? theme.rr : theme.br;
  const haloC = isRed ? theme.rh : theme.bh;
  return `
      <g${extraAttr||''}>
        <circle cx="${cx}" cy="${cy}" r="24" fill="url(#g-${isRed?'r':'b'})" stroke="${ringC}" stroke-width="1.6"/>
        <circle cx="${cx}" cy="${cy}" r="20" fill="none" stroke="${ringC}" stroke-width="0.8" opacity="0.65"/>
        <text x="${cx}" y="${cy+8.5}" font-size="23" fill="${textC}" stroke="${haloC}" stroke-width="1.6"
              paint-order="stroke" stroke-linejoin="round"
              font-family='"Noto Serif TC","PMingLiU",serif' font-weight="900" text-anchor="middle">${p.type}</text>
      </g>`;
}

/* ---- 棋子 ---- */
function renderPieces(ctx){
  let html='';
  ctx.pieces.forEach(p=>{
    const moved = ctx.last && p.col===ctx.last.to[0] && p.row===ctx.last.to[1];
    html += pieceSvg(p, X(dC(p.col)), Y(dR(p.row)), ctx.theme, moved?' data-anim="1"':'');
  });
  return html;
}

/* ---- 吃子殘影 ---- */
function buildCaptureGhost(ctx){
  if(!ctx.stepForward || !ctx.last) return '';
  const before = computeBoardAt(ctx.idx-1, ctx.movesArr);
  const cap = before.find(p=>p.col===ctx.last.to[0] && p.row===ctx.last.to[1]);
  if(!cap) return '';
  return pieceSvg(cap, X(dC(cap.col)), Y(dR(cap.row)), ctx.theme,
                  ' id="capGhost" style="pointer-events:none;"');
}

/* ---- 漸層定義（依主題） ---- */
function renderDefs(theme){
  return `
    <defs>
      <radialGradient id="g-r" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="${theme.r0}"/><stop offset="100%" stop-color="${theme.r1}"/>
      </radialGradient>
      <radialGradient id="g-b" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="${theme.b0}"/><stop offset="100%" stop-color="${theme.b1}"/>
      </radialGradient>
    </defs>`;
}

/* ---- 動畫：走子滑移、殘影淡出、光圈閃爍 ---- */
function triggerAnimations(ctx){
  if(ctx.stepForward && window.requestAnimationFrame){
    const twice = fn => requestAnimationFrame(()=>requestAnimationFrame(fn));

    const g = svg.querySelector('g[data-anim]');
    if(g){
      const dx = X(dC(ctx.last.from[0])) - X(dC(ctx.last.to[0]));
      const dy = Y(dR(ctx.last.from[1])) - Y(dR(ctx.last.to[1]));
      g.style.transition='none';
      g.style.transform=`translate(${dx}px,${dy}px)`;
      twice(()=>{ g.style.transition='transform .28s ease'; g.style.transform='translate(0,0)'; });
    }

    const gh = svg.querySelector('#capGhost');
    if(gh){
      gh.style.transformOrigin = X(dC(ctx.last.to[0]))+'px '+Y(dR(ctx.last.to[1]))+'px';
      gh.style.transition='none';
      gh.style.opacity='1';
      twice(()=>{
        gh.style.transition='opacity .42s ease, transform .42s ease';
        gh.style.opacity='0'; gh.style.transform='scale(.55)';
      });
    }

    const ring = svg.querySelector('#lastRing');
    if(ring){
      ring.style.transition='none';
      ring.setAttribute('r','16'); ring.style.opacity='1'; ring.style.strokeWidth='4';
      twice(()=>{
        ring.style.transition='r .45s ease-out, opacity .45s ease-out, stroke-width .45s ease-out';
        ring.setAttribute('r','27'); ring.style.strokeWidth='2.5';
      });
    }
  }
  AppState.render.prevIdx = ctx.idx;
  AppState.render.prevMode = ctx.rec ? 'rec' : 'play';
}

/* ---- 將軍／絕殺提示（含語音，同一局面只播報一次） ---- */
function updateStatus(ctx){
  const banner = document.getElementById('checkBanner');
  const stmSide = ctx.idx%2===0 ? 'r' : 'b';
  const st = ctx.idx>0 ? checkStatusXQ(ctx.pieces, stmSide) : null;
  if(!st){
    banner.style.display='none';
    AppState.render.lastCheckSpoken='';
    return;
  }
  const who = stmSide==='r' ? '紅方' : '黑方';
  const winner = stmSide==='r' ? '黑方' : '紅方';
  let txt;
  if(st==='mate'){
    txt='☠ 絕殺！'+who+'無解，'+winner+'勝';
    banner.style.cssText+=';display:block;background:rgba(160,30,30,.35);border:1px solid #E05050;color:#FFB4B4;';
  } else {
    txt='⚠ '+who+'被將軍';
    banner.style.cssText+=';display:block;background:rgba(201,120,39,.25);border:1px solid #E0A050;color:#FFD9A0;';
  }
  banner.textContent=txt;
  const key=(ctx.rec?'r':'p')+':'+ctx.idx+':'+st;
  if(AppState.render.lastCheckSpoken!==key){
    AppState.render.lastCheckSpoken=key;
    speak(st==='mate' ? '絕殺' : '將軍');   // 語音精簡；橫幅仍顯示完整資訊
  }
}

/* ---- 開局辨識、形勢曲線、引擎分析 ---- */
function updateAnalysis(ctx){
  updateOpeningReco(ctx.movesArr.slice(0, ctx.idx).map(m=>m.notation));
  renderEvalCurve(ctx.movesArr.slice(0, ctx.rec ? ctx.idx : ctx.movesArr.length), ctx.idx);
  updateTransportUI();
  if(!ctx.rec && AppState.nav.moves.length>0) analyzePosition();
}

/* ---- 總調度 ---- */
function renderBoard(){
  const ctx = getRenderContext();
  svg.innerHTML = renderDefs(ctx.theme)
                + renderGrid()
                + renderAnnotations(ctx)
                + renderPieces(ctx)
                + buildCaptureGhost(ctx);
  triggerAnimations(ctx);
  updateStatus(ctx);
  updateAnalysis(ctx);
}

/* ---------- 即時開局辨識 ---------- */
function updateOpeningReco(tokens){
  const el = document.getElementById('openingReco');
  if(!tokens || tokens.length<2){ el.style.display='none'; return; }
  try{
    const notas = tokens.map(normalizeNotation);
    const exact = matchKnownLines(notas);
    const hits = classifyOpening(notas).filter(h=>!h.cat.includes('總清單'));
    const deepTh = Math.min(10, notas.length);
    if(exact.length>0 && exact[0].score>=deepTh){
      const pct = Math.min(98, 60 + exact[0].score*4);
      el.innerHTML = '🎯 開局辨識：<b>'+exact[0].side+'｜'+exact[0].cat+'</b>（前 '+exact[0].score+' 步完全吻合，'+pct+'%）';
      el.style.display='block';
    } else if(exact.length>0 && exact[0].score>=3){
      const pct = Math.min(85, 45 + exact[0].score*5);
      el.innerHTML = '🎯 開局辨識：<b>'+exact[0].side+'｜'+exact[0].cat+'</b>（吻合 '+exact[0].score+' 步，'+pct+'%）';
      el.style.display='block';
    } else if(hits.length>0){
      el.innerHTML = '🎯 開局辨識：<b>'+hits[0].side+'｜'+hits[0].cat+'</b>（特徵判斷，約 70%）';
      el.style.display='block';
    } else {
      el.style.display='none';
    }
  }catch(e){ el.style.display='none'; }
}

/* ---------- 步列表 / 播放控制 ---------- */

  const wrap = document.getElementById('movesList');
  wrap.innerHTML='';
  if(AppState.nav.moves.length===0){
    wrap.innerHTML = '<span style="font-size:.78rem;color:#C9B48A;">此開局尚無棋譜步驟，可先參考說明文字或搜尋教學影片。</span>';
    return;
  }
  AppState.nav.moves.forEach((mv,i)=>{
    const chip=document.createElement('span');
    chip.className='move-chip';
    chip.textContent=(i+1)+'. '+mv.notation;
    chip.addEventListener('click',()=>{ AppState.nav.index=i+1; renderBoard(); });
    wrap.appendChild(chip);
  });
}

function updateTransportUI(){
  const lbl = document.getElementById('stepLabel');
  if(AppState.rec.on){
    lbl.textContent = '記譜中：'+AppState.rec.moves.length+' 步';
  } else {
    lbl.textContent = AppState.nav.index+' / '+AppState.nav.moves.length;
  }
  const chips = document.querySelectorAll('.move-chip');
  if(!AppState.rec.on) chips.forEach((c,i)=>{ c.classList.toggle('active', i===AppState.nav.index-1); });
}

document.getElementById('btnPrev').addEventListener('click',()=>{ if(AppState.rec.on)return; if(AppState.nav.index>0){AppState.nav.index--; renderBoard();} });
document.getElementById('btnNext').addEventListener('click',()=>{ if(AppState.rec.on)return; if(AppState.nav.index<AppState.nav.moves.length){AppState.nav.index++; renderBoard();} });
document.getElementById('btnLast').addEventListener('click',()=>{ if(AppState.rec.on)return; AppState.nav.index=AppState.nav.moves.length; renderBoard(); });

const btnPlay = document.getElementById('btnPlay');
btnPlay.addEventListener('click',()=>{
  if(AppState.nav.playTimer){
    clearInterval(AppState.nav.playTimer); AppState.nav.playTimer=null; btnPlay.innerHTML='&#9654;';
    return;
  }
  if(AppState.nav.index>=AppState.nav.moves.length) AppState.nav.index=0;
  btnPlay.innerHTML='&#10074;&#10074;';
  AppState.nav.playTimer=setInterval(()=>{
    if(AppState.nav.index>=AppState.nav.moves.length){ clearInterval(AppState.nav.playTimer); AppState.nav.playTimer=null; btnPlay.innerHTML='&#9654;'; return; }
    AppState.nav.index++; renderBoard();
  },1300);
});

      let copied=false;
      try{ copied=document.execCommand('copy'); }catch(e){}
      if(!copied && navigator.clipboard){ navigator.clipboard.writeText(inp.value).then(()=>{}).catch(()=>{}); copied=true; }

      setTimeout(()=>{ box.querySelector('#lfCopy').textContent='複製連結'; },2000);

function openExternal(url){
  let ok=false;
  try{
    const wnd = window.open(url, '_blank', 'noopener');
    ok = !!wnd;
  }catch(e){ ok=false; }
  if(!ok) showLinkFallback(url);
}

/* 攔截所有 target=_blank 連結，統一走 openExternal（沙盒環境自動備援） */

  const a = e.target.closest ? e.target.closest('a[target="_blank"]') : null;
  if(!a || !a.href) return;
  e.preventDefault();
  e.stopPropagation();

/* ==================== 記譜模式 ==================== */
const redNum=['','一','二','三','四','五','六','七','八','九'];
function colName(side,col){ const n = side==='r' ? 9-col : col+1; return side==='r' ? redNum[n] : String(n); }
function stepName(side,k){ return side==='r' ? redNum[k] : String(k); }

function genNotation(pieces, piece, from, to){
  const side=piece.side, cat=pieceCategory(piece.type);
  const straight = (cat==='R'||cat==='C'||cat==='P'||cat==='K');
  const sameColMates = pieces.filter(p=>p.alive && p!==piece && p.side===side &&
    pieceCategory(p.type)===cat && p.col===from[0]);
  let prefix='';
  if(sameColMates.length>0 && (cat==='R'||cat==='C'||cat==='P'||cat==='H')){
    const isFront = side==='r'
      ? from[1] < Math.min(...sameColMates.map(o=>o.row))
      : from[1] > Math.max(...sameColMates.map(o=>o.row));
    prefix = isFront ? '前' : '後';
  }
  let body;
  if(straight){
    if(to[1]===from[1]) body='平'+colName(side,to[0]);
    else{
      const adv = side==='r' ? to[1]<from[1] : to[1]>from[1];
      body=(adv?'進':'退')+stepName(side,Math.abs(to[1]-from[1]));
    }
  } else {
    const adv = side==='r' ? to[1]<from[1] : to[1]>from[1];
    body=(adv?'進':'退')+colName(side,to[0]);
  }
  return prefix ? prefix+piece.type+body : piece.type+colName(side,from[0])+body;
}

function boardPosFromEvent(e){
  const rect = svg.getBoundingClientRect();
  const px = (e.clientX-rect.left) * (544/rect.width);
  const py = (e.clientY-rect.top) * (642/rect.height);
  let bc=-1, br=-1;
  for(let c=0;c<9;c++) if(Math.abs(X(c)-px)<=26){ bc=c; break; }
  for(let r=0;r<10;r++) if(Math.abs(Y(r)-py)<=26){ br=r; break; }
  if(bc<0||br<0) return null;
  return AppState.rec.flip ? [8-bc, 9-br] : [bc, br];
}

svg.addEventListener('click', e=>{
  if(!AppState.rec.on) return;
  const pos = boardPosFromEvent(e);
  if(!pos) return;
  const pieces = computeBoardAt(AppState.rec.moves.length, AppState.rec.moves);
  const sideToMove = AppState.rec.moves.length%2===0 ? 'r' : 'b';
  const clicked = pieces.find(p=>p.col===pos[0] && p.row===pos[1]);

  if(!AppState.rec.selected){
    if(clicked && clicked.side===sideToMove){ AppState.rec.selected=pos; renderBoard(); }
    return;
  }
  // 已選子：點自己另一顆子＝換選；點其他格＝走子
  if(clicked && clicked.side===sideToMove && !(pos[0]===AppState.rec.selected[0]&&pos[1]===AppState.rec.selected[1])){
    AppState.rec.selected=pos; renderBoard(); return;
  }
  if(pos[0]===AppState.rec.selected[0]&&pos[1]===AppState.rec.selected[1]){ AppState.rec.selected=null; renderBoard(); return; }
  const mover = pieces.find(p=>p.col===AppState.rec.selected[0] && p.row===AppState.rec.selected[1]);
  if(!mover){ AppState.rec.selected=null; renderBoard(); return; }
  /* 完整規則驗證：非法走法直接拒絕 */
  if(!isLegalMoveXQ(pieces, sideToMove, AppState.rec.selected, pos)){
    showCoach('✗ 非法走法：'+mover.type+'不能這樣走（含蹩馬腿、塞象眼、炮架、河界、九宮等規則）', 'warn');
    return;
  }
  /* 送將檢查：走完不能讓自己被將軍／照面 */
  {
    const sim = pieces.filter(q=>!(q.col===pos[0]&&q.row===pos[1]&&q.side!==sideToMove)).map(q=>({...q}));
    const sm = sim.find(q=>q.col===AppState.rec.selected[0]&&q.row===AppState.rec.selected[1]);
    sm.col=pos[0]; sm.row=pos[1];
    if(isInCheckXQ(sim, sideToMove)){
      showCoach('✗ 不可送將：這步走完'+(sideToMove==='r'?'紅方':'黑方')+'仍被將軍（或將帥照面）', 'warn');
      return;
    }
  }
  const notation = genNotation(pieces, mover, AppState.rec.selected, pos);
  /* AI 教練：與剛才分析的最佳著法比較 */
  coachFeedback(AppState.rec.selected, pos, notation, pieces, sideToMove);
  AppState.rec.moves.push({from:[...AppState.rec.selected], to:[...pos], notation});
  AppState.rec.selected=null;
  renderRecordedList();
  renderBoard();
  analyzePosition();
});

/* ==================== 語音提示（Web Speech API） ==================== */
AppState.speech = { on:false, voice:null, rate:1.0, ready:false, supported:('speechSynthesis' in window) };

function pickChineseVoice(){
  if(!AppState.speech.supported) return null;
  const vs = window.speechSynthesis.getVoices() || [];
  if(!vs.length) return null;
  /* 優先序：台灣國語 → 粵語/香港 → 其他中文 → 系統預設 */
  const pref = [/zh[-_]TW/i, /cmn[-_]?Hant/i, /zh[-_]HK/i, /zh[-_]CN/i, /^zh/i];
  for(const re of pref){
    const v = vs.find(x=>re.test(x.lang||''));
    if(v) return v;
  }
  return null;
}
function initSpeechVoices(){
  if(!AppState.speech.supported) return;
  const apply=()=>{
    AppState.speech.voice = pickChineseVoice();

    }

/* 將畫面訊息轉為適合朗讀的純文字 */
function speechText(html){
  return String(html)
    .replace(/<[^>]*>/g,'')
    .replace(/[✔✓⚠△☠🎯📚⏳🐟★]/g,'')
    .replace(/：/g,'，')
    .replace(/／/g,'或')
    .replace(/\s+/g,' ')
    .trim();
}
function speak(text, opts){
  if(!AppState.speech.on || !AppState.speech.supported) return;
  const t = speechText(text);
  if(!t) return;
  try{
    if(!(opts && opts.queue)) window.speechSynthesis.cancel();   // 預設打斷前一句，避免積壓
    const u = new SpeechSynthesisUtterance(t);
    if(AppState.speech.voice) u.voice = AppState.speech.voice;
    u.lang = (AppState.speech.voice && AppState.speech.voice.lang) || 'zh-TW';
    u.rate = AppState.speech.rate;
    u.pitch = 1.0;
    window.speechSynthesis.speak(u);
  }catch(e){ /* 語音失敗不影響其他功能 */ }
}

/* 依評分損失換算「此著正確率」（損失越小越接近 100%） */
/* ==================== AI 教練：著法分級 ====================
   依「與引擎首選的評分差距（centipawn loss）」分級，並用引擎推導具體原因。
   妙手＝走出首選、且主動棄子（付出子力卻仍是最佳），非單純好棋。          */
const MOVE_GRADES = [
  { key:'brilliant',  label:'妙手',     icon:'✦', color:'#7BD8E8', tone:'good',
    desc:'棄子取勢，這步需要算度' },
  { key:'best',       label:'最佳',     icon:'★', color:'#6FCF6F', tone:'good',
    desc:'引擎首選' },
  { key:'excellent',  label:'優秀',     icon:'✔', color:'#8FD08F', tone:'good',
    desc:'與首選幾乎無差' },
  { key:'good',       label:'好棋',     icon:'○', color:'#C9D88A', tone:'good',
    desc:'穩健的一步' },
  { key:'inaccuracy', label:'不夠精確', icon:'△', color:'#E8CD7A', tone:'',
    desc:'有更好的下法' },
  { key:'mistake',    label:'失誤',     icon:'✖', color:'#E8A050', tone:'warn',
    desc:'讓出明顯優勢' },
  { key:'blunder',    label:'漏著',     icon:'⚠', color:'#E05050', tone:'warn',
    desc:'嚴重失誤，局面可能就此逆轉' }
];
const GRADE = Object.fromEntries(MOVE_GRADES.map(g=>[g.key,g]));

function gradeMove(lossCp, isBest, isBrilliant){
  if(isBest && isBrilliant) return GRADE.brilliant;
  if(isBest)          return GRADE.best;
  if(lossCp < 20)     return GRADE.excellent;
  if(lossCp < 50)     return GRADE.good;
  if(lossCp < 120)    return GRADE.inaccuracy;
  if(lossCp < 300)    return GRADE.mistake;
  return GRADE.blunder;
}

/* 某格是否被指定方保護（可回吃） */
function isDefendedXQ(pieces, col, row, bySide){
  const alive = pieces.filter(p=>p.alive!==false);
  return alive.some(p=>p.side===bySide && isLegalMoveXQ(alive, bySide, [p.col,p.row], [col,row]));
}

/* 對方最佳「有利可圖」的吃子淨收益（已計入我方回吃） */
function materialAtRisk(piecesAfter, oppSide){
  const alive = piecesAfter.filter(p=>p.alive!==false);
  const mySide = oppSide==='r' ? 'b' : 'r';
  const b = buildBoard(alive);
  let bestNet = 0, victim = null;
  for(const mv of genMoves(b, oppSide)){
    const target = alive.find(p=>p.col===mv.tc && p.row===mv.tr && p.side===mySide);
    if(!target) continue;
    const tv = ENG_VAL[pieceCategory(target.type)] || 0;
    if(tv >= 50000) continue;                       // 將帥不列入子力計算
    const attacker = alive.find(p=>p.col===mv.fc && p.row===mv.fr);
    const av = attacker ? (ENG_VAL[pieceCategory(attacker.type)] || 0) : 0;
    /* 模擬吃完後，我方能否回吃該格 */
    const sim = alive.filter(p=>p!==target).map(p=>({...p}));
    const am = sim.find(p=>p.col===mv.fc && p.row===mv.fr);
    if(am){ am.col=mv.tc; am.row=mv.tr; }
    const recapture = isDefendedXQ(sim, mv.tc, mv.tr, mySide);
    const net = recapture ? (tv - av) : tv;         // 有回吃則淨賺＝被吃子－對方賠上的子
    if(net > bestNet){ bestNet = net; victim = target; }
  }
  return {value:bestNet, piece:victim};
}

/* 依引擎資料推導具體原因（只列舉可驗證的事實，不做空泛評語） */
function detectMoveReasons(from, to, pieces, side, la, isBest){
  const reasons = [];
  const oppSide = side==='r' ? 'b' : 'r';

  /* 模擬走完這一步 */
  const after = pieces.map(p=>({...p, alive:p.alive!==false}));
  const capIdx = after.findIndex(p=>p.alive && p.col===to[0] && p.row===to[1] && p.side!==side);
  const captured = capIdx>=0 ? after[capIdx] : null;
  if(captured) captured.alive=false;
  const mover = after.find(p=>p.alive && p.col===from[0] && p.row===from[1]);
  if(!mover) return reasons;
  mover.col=to[0]; mover.row=to[1];

  const moverVal = ENG_VAL[pieceCategory(mover.type)] || 0;
  const gained   = captured ? (ENG_VAL[pieceCategory(captured.type)] || 0) : 0;
  const riskAfter  = materialAtRisk(after, oppSide);
  const riskBefore = materialAtRisk(pieces.map(p=>({...p, alive:p.alive!==false})), oppSide);
  /* 只計「這一步新造成」的損失，原本就存在的威脅不算在這步頭上 */
  const newRisk = riskAfter.value - Math.max(riskBefore.value, gained);

  /* 1. 這步讓子力落空 */
  if(newRisk > 60){
    reasons.push('走後對方可吃掉'+(riskAfter.piece?('你的'+riskAfter.piece.type):'子力')
                 +'（淨損約 '+(newRisk/100).toFixed(1)+' 分）');
  }
  /* 2. 錯過吃子機會 */
  if(!isBest && la && la.all && la.all.length){
    const bm = la.all[0].m;
    const bestTarget = pieces.find(p=>p.alive!==false && p.col===bm.tc && p.row===bm.tr && p.side!==side);
    if(bestTarget && !captured){
      reasons.push('錯過吃'+bestTarget.type+'的機會');
    }
  }
  /* 3. 中路控制 */
  if(!isBest && la && la.all && la.all.length){
    const bm = la.all[0].m;
    if(bm.tc===4 && to[0]!==4) reasons.push('首選是搶佔中路，此步放棄了中路控制');
  }
  /* 4. 形勢由優轉劣 */
  if(la && typeof la.rootScore==='number'){
    const before = la.rootScore, now = la.all ? (la.all.find(s=>
      s.m.fc===from[0]&&s.m.fr===from[1]&&s.m.tc===to[0]&&s.m.tr===to[1]) || {}).score : undefined;
    if(typeof now==='number' && before>=30 && now<=-30) reasons.push('形勢由領先轉為落後');
  }
  return reasons.slice(0,2);
}

/* 判斷是否為「妙手」：走出首選、且主動付出子力 */
function isBrilliantMove(from, to, pieces, side){
  const oppSide = side==='r' ? 'b' : 'r';
  const after = pieces.map(p=>({...p, alive:p.alive!==false}));
  const capIdx = after.findIndex(p=>p.alive && p.col===to[0] && p.row===to[1] && p.side!==side);
  const captured = capIdx>=0 ? after[capIdx] : null;
  if(captured) captured.alive=false;
  const mover = after.find(p=>p.alive && p.col===from[0] && p.row===from[1]);
  if(!mover) return false;
  mover.col=to[0]; mover.row=to[1];
  const gained = captured ? (ENG_VAL[pieceCategory(captured.type)]||0) : 0;
  const riskAfter = materialAtRisk(after, oppSide);
  const riskBefore = materialAtRisk(pieces.map(p=>({...p, alive:p.alive!==false})), oppSide);
  const netLoss = riskAfter.value - Math.max(riskBefore.value, gained);
  /* 本步新增淨損 1.5 分以上子力仍是引擎首選 → 視為棄子妙手 */
  return netLoss >= 150;
}

function moveAccuracy(lossCp){
  const l = Math.max(0, lossCp);
  return Math.max(15, Math.round(100 * Math.exp(-l/260)));
}

/* 本局各方正確率統計 */
function pushCoachStat(side, acc, gradeKey){

}

  const st = AppState.analysis.coachStats;
  const avg = arr => arr.length ? Math.round(arr.reduce((a,b)=>a+b.acc,0)/arr.length) : null;
  return {r:avg(st.r), b:avg(st.b), rn:st.r.length, bn:st.b.length};
}

  el.style.display='block';

    '<span style="opacity:.6;">（'+n+' 步）</span></span>';

function coachFeedback(from, to, notation, pieces, sideToMove){
  const la = AppState.analysis.lastRoot;
  if(!la || la.ply!==AppState.rec.moves.length || !la.all || !la.all.length) return;
  const played = la.all.find(s=>s.m.fc===from[0]&&s.m.fr===from[1]&&s.m.tc===to[0]&&s.m.tr===to[1]);
  if(!played) return;
  const best = la.all[0];
  const lossCp = Math.max(0, best.score - played.score);
  const isBest = best.m.fc===from[0]&&best.m.fr===from[1]&&best.m.tc===to[0]&&best.m.tr===to[1];
  const brilliant = isBest && isBrilliantMove(from, to, pieces, sideToMove);
  const g = gradeMove(lossCp, isBest, brilliant);
  const acc = moveAccuracy(lossCp);
  const reasons = isBest ? [] : detectMoveReasons(from, to, pieces, sideToMove, la, isBest);

  pushCoachStat(sideToMove, acc, g.key);
  renderCoachSummary();

  const badge = '<span style="display:inline-block;padding:1px 8px;margin-right:6px;border-radius:6px;'+
    'background:'+g.color+'22;border:1px solid '+g.color+';color:'+g.color+';font-weight:800;">'+
    g.icon+' '+g.label+'</span>';
  let html = badge+'<b>'+notation+'</b>　<span style="opacity:.8;">正確率 '+acc+'%</span>';
  if(!isBest) html += '　<span style="opacity:.7;">損失 '+(lossCp/100).toFixed(2)+' 分</span>';
  if(reasons.length) html += '<br><span style="opacity:.9;">原因：'+reasons.join('；')+'</span>';
  if(!isBest && la.topNotation) html += '<br>建議改走 <b style="color:#8FC8E8;">'+la.topNotation+'</b>';
  else if(brilliant) html += '<br><span style="opacity:.85;">'+g.desc+'</span>';

  showCoach(html, g.tone);
}

/* ---------- 開局比對搜尋 ---------- */
function normalizeNotation(s){
  return s.replace(/车/g,'車').replace(/马/g,'馬').replace(/炮/g,'砲')
          .replace(/进/g,'進').replace(/后/g,'後').replace(/帅/g,'帥')
          .replace(/将/g,'將').replace(/仕/g,'士');
}

function classifyOpening(notas){
  const hits=[]; // {side, cat, why}
  if(notas.length===0) return hits;
  const m1=notas[0]||'', m2=notas[1]||'', m3=notas[2]||'', m4=notas[3]||'';
  const isCenterCannon = /^砲[二八]平五/.test(m1);
  const add=(side,cat,why)=>{ if(DATA[side][cat] && !hits.some(h=>h.cat===cat)) hits.push({side,cat,why}); };

  if(isCenterCannon){
    const blk = notas.filter((_,i)=>i%2===1);           // 黑方著法
    const blkEarly = blk.slice(0,5);                     // 黑方前5著
    // 左砲封車：黑方砲8進4封鎖紅方二路車
    if(blkEarly.some(n=>/^砲8進4/.test(n))){
      add('後手','後手左砲封車','黑方砲8進4封鎖紅車（左砲封車）');
      add('先手','左砲封車','黑方左砲封車（紅方視角應法）');
    }
    // 三步虎：黑方平邊砲（砲2平1／砲8平9）亮車 —— 掃描黑方前5著
    if(blkEarly.some(n=>/^砲[28]平[19]/.test(n))){
      add('先手','中砲對三步虎','黑方平邊砲亮車（三步虎）');
      add('後手','後手中炮對三步虎','黑方三步虎（後手視角）');
    }
    if(/^砲8平5/.test(blk[0]||'')) add('先手','中砲對順手砲','黑第1著 砲8平5（順手砲）');
    if(/^砲2平5/.test(blk[0]||'')) add('先手','中炮對列手砲','黑第1著 砲2平5（列手砲）');
    if(blkEarly.some(n=>/^砲[28]平[46]/.test(n))){
      add('先手','中砲對反宮馬','黑方士角砲（反宮馬）');
      add('後手','後手反宮馬','黑方反宮馬（後手視角）');
    }
    if(blkEarly.slice(0,3).some(n=>/^象[37]進5/.test(n))) add('先手','中砲對飛象局','黑方飛象固防');
    if(blkEarly.slice(0,2).some(n=>/^馬[28]進[19]/.test(n))) add('先手','中砲對單提馬','黑方邊馬（單提馬）');
    if(/^卒[37]進1/.test(blk[0]||'')) add('先手','中砲對仙人指路','黑第1著 挺卒');
    if(blkEarly.some(n=>/^砲[28]進2/.test(n))){
      add('先手','中砲對巡河砲','黑砲進二（巡河砲）');
      add('後手','後手巡河砲','黑方巡河砲（後手視角）');
    }
    const hasM87 = blkEarly.some(n=>/^馬8進7/.test(n));
    const hasM23 = blkEarly.some(n=>/^馬2進3/.test(n));
    if(hasM87 && hasM23){
      add('先手','中砲對屏風馬','黑方雙正馬（屏風馬）');
      add('後手','後手中砲對屏風馬','黑方屏風馬（後手視角）');
    }
    else if((hasM87||hasM23) && hits.length===0)
      add('先手','中砲對屏風馬','黑方正馬（可能走向屏風馬）');
  }
  else if(/^砲[二八]平[四六]/.test(m1)){
    // 紅方第一手士角砲(炮二平四/炮八平六)或過宮砲(炮二平六/炮八平四)
    const overPalace = /^砲二平六/.test(m1)||/^砲八平四/.test(m1);
    if(overPalace) add('後手','後手中砲對過宮砲','紅方過宮砲（若您執黑）');
    else add('後手','後手對士角砲','紅方士角砲（若您執黑）');
  }
  else if(/^兵[三七]進1?一?/.test(m1)){
    add('先手','仙人指路（先手起手式）','第1步 挺兵（仙人指路）');
    if(/^砲[28]平[37]/.test(m2)) add('先手','先手仙人指路對卒底炮','第2步 卒底砲應仙人指路');
    add('後手','後手中炮對仙人指路','若您執黑：對方仙人指路');
  }
  else if(/^相[三七]進五/.test(m1)){
    add('後手','後手中炮對飛象局','第1步 飛相（若您執黑）');
  }
  else if(/^馬[二八]進[三七]/.test(m1)){
    add('後手','後手中炮對起馬局','第1步 起馬（若您執黑）');
  }
  return hits;
}

function matchKnownLines(notas){
  const results=[];
  Object.keys(DATA).forEach(side=>{
    Object.keys(DATA[side]).forEach(cat=>{
      DATA[side][cat].lines.forEach(line=>{
        if(!line.moves || line.moves.length===0) return;
        let n=0;
        while(n<notas.length && n<line.moves.length &&
              normalizeNotation(line.moves[n].notation)===notas[n]) n++;
        if(n>=2) results.push({side,cat,why:'與「'+line.name+'」前'+n+'步完全吻合',score:n});
      });
    });
  });
  results.sort((a,b)=>b.score-a.score);
  return results;
}

document.getElementById('btnSearchOpen').addEventListener('click', ()=>{
  const box = document.getElementById('searchResults');
  const notas = (AppState.rec.on?AppState.rec.moves:AppState.nav.moves.slice(0,AppState.nav.index)).map(m=>normalizeNotation(m.notation));
  box.innerHTML='';
  if(notas.length===0){
    box.innerHTML='<div class="sr-empty">目前棋盤還沒有任何走子。請先開始記譜並走幾步，或先播放某個棋譜，再按搜尋。</div>';
    box.classList.add('show');
    return;
  }
  const exact = matchKnownLines(notas);
  const classified = classifyOpening(notas);
  const seen = new Set();
  let all = [...exact, ...classified].filter(r=>{
    const k=r.side+'|'+r.cat;
    if(seen.has(k)) return false;
    seen.add(k); return true;
  });

document.getElementById('footNote').textContent =
  '棋譜來源：可用「匯入棋譜」貼上中文記譜、PlayOK／WXF、ICCS 座標或東萍 DhtmlXQ 格式，自動偵測、驗證合法性並分類收錄。';

/* ==================== 匯入棋譜 ==================== */
const MOVE_TOKEN_RE = /[前后後中]?[車车馬马砲炮相象仕士帥帅將将兵卒][一二三四五六七八九1-9]?[平進进退][一二三四五六七八九1-9]/g;

function tokenizeRecord(text){
  const norm = text
    .replace(/[０-９]/g, d=>String.fromCharCode(d.charCodeAt(0)-0xFEE0))                       // 全形數字
    .replace(/([車车馬马砲炮相象仕士帥帅將将兵卒前后後中一二三四五六七八九0-9])[ \t\-－—–·．.]+(?=[車车馬马砲炮相象仕士帥帅將将兵卒平進进退一二三四五六七八九0-9])/g,'$1'); // 著法內分隔符
  return norm.match(MOVE_TOKEN_RE) || [];
}

/* ---------- 多格式棋譜解析（PlayOK/WXF、ICCS/UCI 座標、東萍 DhtmlXQ） ---------- */
const WXF_TOKEN_RE = /^[+\-]?[CHRPEAKNB][1-9]?[.=+\-][1-9]$/i;

/* 從東萍 DhtmlXQ 棋譜碼擷取對局中繼資料（棋手、賽事、日期、勝負） */
function parseDhtmlXqMeta(text){
  const tag = (name)=>{
    const m = text.match(new RegExp('\\[DhtmlXQ_'+name+'\\]([\\s\\S]*?)\\[\\/DhtmlXQ_'+name+'\\]','i'));
    return m ? m[1].trim() : '';
  };
  const stripTeam = (s)=>{           // 「杭州 王天一」→ 取棋手名
    const parts = s.split(/[\s　]+/).filter(Boolean);
    return parts.length>1 ? parts[parts.length-1] : s;
  };
  const red   = tag('redname')   || stripTeam(tag('red'));
  const black = tag('blackname') || stripTeam(tag('black'));
  if(!red && !black) return null;
  const rawResult = tag('result');
  const result = /紅勝|红胜/.test(rawResult) ? '紅勝'
               : /黑勝|黑胜/.test(rawResult) ? '黑勝'
               : /和/.test(rawResult) ? '和局' : (rawResult||'');
  return {
    red, black,
    redTeam: tag('redteam'), blackTeam: tag('blackteam'),
    event: tag('event'), round: tag('round'),
    date: (tag('date')||'').slice(0,10),
    result, open: tag('open'), place: tag('place')
  };
}

/* 賽事名稱 → 大師棋庫分類（可依需要擴充） */
const EVENT_CATEGORIES = [
  { cat:'2026全國冠軍', test:/2026.*(全國|全国).*(individual|個人|个人|冠軍|冠军|錦標|锦标)/i },
  { cat:'全國冠軍',     test:/(全國|全国).*(個人|个人|冠軍|冠军|錦標|锦标|棋王|大棋聖|大棋圣)/ },
  { cat:'亞錦賽',       test:/(亞洲|亚洲|亞錦|亚锦)/ },
  { cat:'世界盃',       test:/世界.*(盃|杯|錦標|锦标|冠軍|冠军|團體|团体)|世錦|世锦|world/i },
  { cat:'象甲聯賽',     test:/(象甲|甲級|甲级)/ }
];
function categorizeEvent(eventName){
  const e = String(eventName||'');
  for(const r of EVENT_CATEGORIES) if(r.test.test(e)) return r.cat;
  return e ? '其他賽事' : '大師對局';
}

function detectRecordFormat(text){
  if(/\[DhtmlXQ_movelist\]/i.test(text)) return 'dhtmlxq';
  const latin = text.replace(/\[[^\]]*\]/g,' ').split(/[\s,]+/).filter(Boolean);
  if(latin.some(t=>WXF_TOKEN_RE.test(t))) return 'wxf';
  if(latin.some(t=>/^[a-iA-I][0-9][\-–.]?[a-iA-I][0-9]$/.test(t))) return 'iccs';
  return 'cn';
}

/* 以現有引擎驗證合法性、以 genNotation 產生中文記譜的共用重播器 */
function replayCoordMoves(coordList){
  const pieces = initialPieces().map(p=>({...p, alive:true}));
  const out=[];
  coordList.forEach((mv,i)=>{
    const side = i%2===0 ? 'r' : 'b';
    const alive = pieces.filter(p=>p.alive);
    const b = buildBoard(alive);
    const ok = genMoves(b, side).some(m=>m.fc===mv.from[0]&&m.fr===mv.from[1]&&m.tc===mv.to[0]&&m.tr===mv.to[1]);
    if(!ok) throw new Error('第'+(i+1)+'著不合法：'+(mv.raw||''));
    const mover = alive.find(p=>p.col===mv.from[0] && p.row===mv.from[1]);
    if(!mover) throw new Error('第'+(i+1)+'著找不到棋子：'+(mv.raw||''));
    out.push(genNotation(pieces, mover, mv.from, mv.to));
    const cap = alive.find(p=>p.col===mv.to[0] && p.row===mv.to[1] && p!==mover);
    if(cap) cap.alive=false;
    mover.col=mv.to[0]; mover.row=mv.to[1];
  });
  return out;
}

/* WXF/PlayOK：C2.5 / C2=5 / h8+7 / +R.6，紅黑依著法順序判定 */
function wxfResolve(pieces, side, tok){
  let m = tok.match(/^([CHRPEAKNB])([1-9])([.=+\-])([1-9])$/i), rel=null, cat, file=null, act, num;
  if(m){ cat=m[1]; file=+m[2]; act=m[3]; num=+m[4]; }
  else{
    m = tok.match(/^([+\-])([CHRPEAKNB])([.=+\-])([1-9])$/i);
    if(!m) return null;
    rel=m[1]; cat=m[2]; act=m[3]; num=+m[4];
  }
  cat=cat.toUpperCase(); if(cat==='N')cat='H'; if(cat==='B')cat='E';
  if(act==='=')act='.';
  const alive = pieces.filter(p=>p.alive);
  const b = buildBoard(alive);
  const legal = genMoves(b, side);
  let cands = alive.filter(p=>p.side===side && pieceCategory(p.type)===cat);
  if(file!==null) cands = cands.filter(p=>p.col===sideColToScreen(side,file));
  cands.sort((a,b2)=> side==='r' ? a.row-b2.row : b2.row-a.row);   // 前（靠近對方）在先
  const fwd = side==='r' ? -1 : 1;
  const matches=[];
  for(const p of cands){
    const targets=[];
    if(act==='.') targets.push([sideColToScreen(side,num), p.row]);
    else{
      const dir = act==='+' ? fwd : -fwd;
      if(cat==='R'||cat==='C'||cat==='K'||cat==='P') targets.push([p.col, p.row+dir*num]);
      else{
        const tc = sideColToScreen(side,num);
        const steps = cat==='H' ? [1,2] : cat==='E' ? [2] : [1];
        for(const s of steps) targets.push([tc, p.row+dir*s]);
      }
    }
    for(const t of targets){
      if(t[0]<0||t[0]>8||t[1]<0||t[1]>9) continue;
      if(legal.some(mv=>mv.fc===p.col&&mv.fr===p.row&&mv.tc===t[0]&&mv.tr===t[1]))
        matches.push({from:[p.col,p.row], to:t});
    }
  }
  if(!matches.length) return null;
  if(rel==='-') return matches[matches.length-1];
  return matches[0];
}

function wxfToChinese(text){
  const clean = text.replace(/\[[^\]]*\]/g,' ').replace(/\{[^}]*\}/g,' ')
                    .replace(/(1-0|0-1|1\/2-1\/2)(\s|$)/g,' ');
  const toks = clean.split(/[\s,]+/).filter(t=>t && WXF_TOKEN_RE.test(t));
  if(toks.length<2) throw new Error('無法辨識 WXF/PlayOK 著法');
  const pieces = initialPieces().map(p=>({...p, alive:true}));
  const out=[];
  toks.forEach((tok,i)=>{
    const side = i%2===0 ? 'r' : 'b';
    const mv = wxfResolve(pieces, side, tok);
    if(!mv) throw new Error('第'+(i+1)+'著無法解析或不合法：'+tok);
    const mover = pieces.find(p=>p.alive && p.col===mv.from[0] && p.row===mv.from[1]);
    out.push(genNotation(pieces, mover, mv.from, mv.to));
    const cap = pieces.find(p=>p.alive && p.col===mv.to[0] && p.row===mv.to[1] && p!==mover);
    if(cap) cap.alive=false;
    mover.col=mv.to[0]; mover.row=mv.to[1];
  });
  return out;
}

/* ICCS/UCI 座標：H2-E2 / h2e2（a-i＝紅方左至右、0-9＝紅方底線起算） */
function iccsToChinese(text){
  const raw = text.replace(/\[[^\]]*\]/g,' ');
  const toks = raw.split(/[\s,]+/).map(t=>{
    const m=t.match(/^([a-iA-I][0-9])[\-–.]?([a-iA-I][0-9])$/);
    return m ? (m[1]+m[2]).toLowerCase() : null;
  }).filter(Boolean);
  if(toks.length<2) throw new Error('無法辨識座標著法');
  const list = toks.map(s=>({
    from:[s.charCodeAt(0)-97, 9-parseInt(s[1],10)],
    to:[s.charCodeAt(2)-97, 9-parseInt(s[3],10)],
    raw:s
  }));
  return replayCoordMoves(list);
}

/* 東萍 DhtmlXQ：movelist 內 4 位數字一組（起x起y迄x迄y，上黑下紅） */
function dhtmlxqToChinese(text){
  const m = text.match(/\[DhtmlXQ_movelist\]([\s\S]*?)\[\/DhtmlXQ_movelist\]/i);
  if(!m) throw new Error('找不到 DhtmlXQ 著法列表');
  const digits = m[1].replace(/\D/g,'');
  if(digits.length<8 || digits.length%4!==0) throw new Error('DhtmlXQ 著法長度異常');
  const list=[];
  for(let i=0;i<digits.length;i+=4){
    list.push({from:[+digits[i],+digits[i+1]], to:[+digits[i+2],+digits[i+3]], raw:digits.slice(i,i+4)});
  }
  return replayCoordMoves(list);
}

const FORMAT_LABEL = {wxf:'PlayOK／WXF 西式記譜', iccs:'ICCS／UCI 座標', dhtmlxq:'東萍 DhtmlXQ', cn:'中文記譜'};

function parseAnyRecord(raw){
  const fmt = detectRecordFormat(raw);
  let tokens;
  if(fmt==='wxf') tokens = wxfToChinese(raw);
  else if(fmt==='iccs') tokens = iccsToChinese(raw);
  else if(fmt==='dhtmlxq') tokens = dhtmlxqToChinese(raw);
  else tokens = tokenizeRecord(raw);
  return {fmt, tokens};
}

/* 通用儲存層：一般瀏覽器用 localStorage；Claude 預覽環境後援 window.storage */
const STORE = {
  async get(key){
    try{ if(window.localStorage){ const v=localStorage.getItem(key); if(v!==null) return v; } }catch(e){}
    try{ if(window.storage && window.storage.get){ const r=await window.storage.get(key); if(r&&r.value) return r.value; } }catch(e){}
    return null;
  },
  set(key, val){
    try{ if(window.localStorage) localStorage.setItem(key, val); }catch(e){}
    try{ if(window.storage && window.storage.set) window.storage.set(key, val); }catch(e){}
  }
};

function persistImports(){
  STORE.set('xiangqi_imported_games', JSON.stringify(AppState.library.imported));
}
function persistMasters(){
  STORE.set('xiangqi_master_games', JSON.stringify(AppState.library.masterRaw));
}

function addImportedGame(side, cat, name, tokens, save){
  let moves;
  try{ moves = buildMovesFromNotation(tokens); }
  catch(e){ return {ok:false, err:e.message}; }
  const entry = ensureCategory(side, cat);
  entry.lines.push({name, desc:'由匯入棋譜功能加入，共 '+tokens.length+' 步（'+Math.ceil(tokens.length/2)+' 回合）。', moves});
  if(save!==false){
    AppState.library.imported.push({side, cat, name, tokens});
    persistImports();
  }
  return {ok:true};
}

  sideSelect.value=side;
  populateCategories();
  const entry=DATA[side][cat];
  selectCategory(cat, entry.lines.length-1);
  refreshImportCategoryOptions();
});
