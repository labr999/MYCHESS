/* ==================== 內建象棋引擎（離線分析） ==================== */
/* （ENG_VAL 已提前宣告於 AppState 之後，避免初始化順序問題） */

function buildBoard(pieces){
  const b = Array.from({length:10},()=>Array(9).fill(null));
  pieces.forEach(p=>{ b[p.row][p.col] = {side:p.side, cat:pieceCategory(p.type), type:p.type}; });
  return b;
}
function inBoard(c,r){ return c>=0&&c<9&&r>=0&&r<10; }
function inPalace(side,c,r){ return c>=3&&c<=5 && (side==='r' ? r>=7&&r<=9 : r>=0&&r<=2); }
function ownHalf(side,r){ return side==='r' ? r>=5 : r<=4; }

function genMoves(b, side){
  const moves=[];
  const push=(fc,fr,tc,tr)=>{
    const t=b[tr][tc];
    if(t && t.side===side) return;
    moves.push({fc,fr,tc,tr,cap:t?ENG_VAL[t.cat]:0});
  };
  for(let r=0;r<10;r++)for(let c=0;c<9;c++){
    const p=b[r][c];
    if(!p || p.side!==side) continue;
    const cat=p.cat;
    if(cat==='R'){
      for(const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){
        let tc=c+dc,tr=r+dr;
        while(inBoard(tc,tr)){
          if(!b[tr][tc]){ push(c,r,tc,tr); }
          else { push(c,r,tc,tr); break; }
          tc+=dc; tr+=dr;
        }
      }
    }
    else if(cat==='C'){
      for(const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){
        let tc=c+dc,tr=r+dr, jumped=false;
        while(inBoard(tc,tr)){
          if(!jumped){
            if(!b[tr][tc]) push(c,r,tc,tr);
            else jumped=true;
          } else {
            if(b[tr][tc]){ if(b[tr][tc].side!==side) push(c,r,tc,tr); break; }
          }
          tc+=dc; tr+=dr;
        }
      }
    }
    else if(cat==='H'){
      const jumps=[[1,2,0,1],[-1,2,0,1],[1,-2,0,-1],[-1,-2,0,-1],[2,1,1,0],[2,-1,1,0],[-2,1,-1,0],[-2,-1,-1,0]];
      for(const [dc,dr,lc,lr] of jumps){
        const tc=c+dc,tr=r+dr;
        if(!inBoard(tc,tr)) continue;
        if(b[r+lr][c+lc]) continue;
        push(c,r,tc,tr);
      }
    }
    else if(cat==='E'){
      for(const [dc,dr] of [[2,2],[2,-2],[-2,2],[-2,-2]]){
        const tc=c+dc,tr=r+dr;
        if(!inBoard(tc,tr) || !ownHalf(side,tr)) continue;
        if(b[r+dr/2][c+dc/2]) continue;
        push(c,r,tc,tr);
      }
    }
    else if(cat==='A'){
      for(const [dc,dr] of [[1,1],[1,-1],[-1,1],[-1,-1]]){
        const tc=c+dc,tr=r+dr;
        if(!inBoard(tc,tr) || !inPalace(side,tc,tr)) continue;
        push(c,r,tc,tr);
      }
    }
    else if(cat==='K'){
      for(const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const tc=c+dc,tr=r+dr;
        if(!inBoard(tc,tr) || !inPalace(side,tc,tr)) continue;
        push(c,r,tc,tr);
      }
      const dr2 = side==='r' ? -1 : 1;
      let tr=r+dr2;
      while(inBoard(c,tr)){
        if(b[tr][c]){
          if(b[tr][c].cat==='K' && b[tr][c].side!==side) push(c,r,c,tr);
          break;
        }
        tr+=dr2;
      }
    }
    else if(cat==='P'){
      const fw = side==='r' ? -1 : 1;
      if(inBoard(c,r+fw)) push(c,r,c,r+fw);
      if(!ownHalf(side,r)){
        if(inBoard(c+1,r)) push(c,r,c+1,r);
        if(inBoard(c-1,r)) push(c,r,c-1,r);
      }
    }
  }
  moves.sort((a,b2)=>b2.cap-a.cap);
  return moves;
}

function evalBoard(b, side){
  let score=0;
  for(let r=0;r<10;r++)for(let c=0;c<9;c++){
    const p=b[r][c];
    if(!p) continue;
    let v = ENG_VAL[p.cat];
    if(p.cat==='P'){
      const crossed = p.side==='r' ? r<=4 : r>=5;
      if(crossed) v += 80;
      const adv = p.side==='r' ? (6-Math.min(r,6)) : (Math.max(r,3)-3);
      v += adv*8;
      if(c>=3&&c<=5) v+=15;
    }
    if(p.cat==='H'||p.cat==='C'){
      if(c>=2&&c<=6) v+=12;
      const out = p.side==='r' ? r<9 : r>0;
      if(out && p.cat==='H') v+=15;
    }
    if(p.cat==='C' && c===4) v+=25;
    score += (p.side===side ? v : -v);
  }
  return score;
}

function qsearch(b, side, alpha, beta, qd){
  const stand = evalBoard(b, side);
  if(stand >= beta) return stand;
  if(stand > alpha) alpha = stand;
  if(qd <= 0) return alpha;
  const caps = genMoves(b, side).filter(m=>m.cap>0);
  for(const m of caps){
    const t=b[m.tr][m.tc];
    if(t && t.cat==='K') return 95000;
    const f=b[m.fr][m.fc];
    b[m.tr][m.tc]=f; b[m.fr][m.fc]=null;
    const sc = -qsearch(b, side==='r'?'b':'r', -beta, -alpha, qd-1);
    b[m.fr][m.fc]=f; b[m.tr][m.tc]=t;
    if(sc > alpha) alpha = sc;
    if(alpha >= beta) break;
  }
  return alpha;
}

function negamax(b, side, depth, alpha, beta){
  if(depth===0) return qsearch(b, side, alpha, beta, 8);
  const moves = genMoves(b, side);
  if(moves.length===0) return -90000;
  let best=-Infinity;
  for(const m of moves){
    const t=b[m.tr][m.tc];
    if(t && t.cat==='K') return 95000 - (3-depth);
    const f=b[m.fr][m.fc];
    b[m.tr][m.tc]=f; b[m.fr][m.fc]=null;
    const sc = -negamax(b, side==='r'?'b':'r', depth-1, -beta, -alpha);
    b[m.fr][m.fc]=f; b[m.tr][m.tc]=t;
    if(sc>best) best=sc;
    if(best>alpha) alpha=best;
    if(alpha>=beta) break;
  }
  return best;
}

function localAnalyze(pieces, stm){
  const side = stm==='w' ? 'r' : 'b';
  const b = buildBoard(pieces);
  const moves = genMoves(b, side);
  if(moves.length===0) return {best:-90000, top:[]};
  // 迭代加深：depth 2 起步，時間預算內盡量加深到 depth 4
  const BUDGET = 700;   // ms
  const t0 = Date.now();
  let scored = [];
  for(let d=2; d<=4; d++){
    const pass = [];
    let alpha = -Infinity;
    // 用上一輪排序結果優先搜索，提升剪枝
    const order = scored.length ? scored.map(s=>s.m) : moves;
    let aborted = false;
    for(const m of order){
      if(Date.now()-t0 > BUDGET){ aborted = true; break; }
      const t = b[m.tr][m.tc];
      if(t && t.cat==='K'){ pass.push({m, score:95000}); alpha=95000; continue; }
      const f = b[m.fr][m.fc];
      b[m.tr][m.tc]=f; b[m.fr][m.fc]=null;
      const sc = -negamax(b, side==='r'?'b':'r', d-1, -Infinity, -alpha+50);
      b[m.fr][m.fc]=f; b[m.tr][m.tc]=t;
      pass.push({m, score:sc});
      if(sc>alpha) alpha=sc;
    }
    if(pass.length===order.length || scored.length===0){
      pass.sort((a,b2)=>b2.score-a.score);
      scored = pass;
    }
    if(aborted || Date.now()-t0 > BUDGET) break;
  }
  const safe = scored.filter(s=>s.score>-80000);
  const top = (safe.length?safe:scored).slice(0,3);
  const best = top.length? top[0].score : -90000;
  return {best, top, all: (safe.length?safe:scored)};
}

/* ==================== 即時局勢分析（雲庫/Pikafish） ==================== */
function fenFromPosition(pieces, sideToMove){
  const letterMap = {R:'R',H:'N',E:'B',A:'A',K:'K',C:'C',P:'P'};
  let rows=[];
  for(let r=0;r<10;r++){
    let row='', empty=0;
    for(let c=0;c<9;c++){
      const p = pieces.find(x=>x.col===c && x.row===r);
      if(!p){ empty++; continue; }
      if(empty>0){ row+=empty; empty=0; }
      const L = letterMap[pieceCategory(p.type)];
      row += (p.side==='r') ? L : L.toLowerCase();
    }
    if(empty>0) row+=empty;
    rows.push(row);
  }
  return rows.join('/')+' '+sideToMove+' - - 0 1';
}

function uciToCoords(uci){
  // 檔位 a-i = col 0-8；行位 0-9 由紅方底線往上 = row 9-0
  const fc = uci.charCodeAt(0)-97, fr = 9-parseInt(uci[1],10);
  const tc = uci.charCodeAt(2)-97, tr = 9-parseInt(uci[3],10);
  return {from:[fc,fr], to:[tc,tr]};
}


function renderAnalysis(pieces, stm, best, top3, sourceLabel){
  const evalText = document.getElementById('evalText');
  const bestBox = document.getElementById('bestMoves');
  const bar = document.getElementById('evalBar');
  const redScore = (stm==='w') ? best : -best;
  const pawns = (redScore/100).toFixed(2);
  const leadTxt = redScore>15 ? '紅方優勢' : redScore<-15 ? '黑方優勢' : '局勢均衡';
  evalText.innerHTML = '<b style="color:'+(redScore>15?'#D6584F':redScore<-15?'#E4C874':'#C9A227')+';">'+leadTxt+'</b>　紅方 '+(redScore>=0?'+':'')+pawns+'　（輪'+(stm==='w'?'紅':'黑')+'方走）<span style="font-size:.66rem;color:#C9B48A;">｜'+sourceLabel+'</span>';
  const pct = 50 + 50*Math.tanh(redScore/400);
  bar.style.width = pct.toFixed(1)+'%';
  bestBox.innerHTML='';
  top3.forEach((e,i)=>{
    const from=e.from, to=e.to;
    const mover = pieces.find(p=>p.col===from[0] && p.row===from[1]);
    const label = mover ? genNotation(pieces, mover, from, to) : '?';
    const rs = (stm==='w') ? e.score : -e.score;
    const div=document.createElement('div');
    div.className='best-move';
    div.innerHTML='<span class="bm-rank">'+(i+1)+'</span><span class="bm-move">'+label+'</span><span class="bm-score">評分 紅方 '+(rs>=0?'+':'')+(rs/100).toFixed(2)+'</span>';
    div.title = AppState.rec.on ? '點擊直接走這一步' : '點擊從此局面接續記譜推演';
    div.addEventListener('click', ()=>{
      if(!AppState.rec.on){
        // 播放模式：以目前瀏覽到的局面為起點，切入記譜模式接續推演
        const seed = AppState.nav.moves.slice(0, AppState.nav.index).map(m=>({from:[...m.from], to:[...m.to], notation:m.notation}));
        startRecording(AppState.rec.flip);
        AppState.rec.moves = seed;
      }
      const nowPieces = computeBoardAt(AppState.rec.moves.length, AppState.rec.moves);
      const m = nowPieces.find(p=>p.col===from[0] && p.row===from[1]);
      if(!m) return;
      const notation = genNotation(nowPieces, m, from, to);
      AppState.rec.moves.push({from:[...from], to:[...to], notation});
      AppState.rec.selected=null;
      renderRecordedList();
      renderBoard();
      analyzePosition();
    });
    bestBox.appendChild(div);
  });
}

function analyzePosition(){
  const movesArr = AppState.rec.on ? AppState.rec.moves : AppState.nav.moves.slice(0, AppState.nav.index);
  if(!AppState.rec.on && AppState.nav.moves.length===0) return;   // 播放模式但無棋譜可分析
  const seq = ++AppState.analysis.seq;
  const evalText = document.getElementById('evalText');
  evalText.textContent = '分析中…';
  const pieces = computeBoardAt(movesArr.length, movesArr);
  const stm = movesArr.length%2===0 ? 'w' : 'b';

  // 內建引擎立即分析（保證可用）
  setTimeout(()=>{
    if(seq !== AppState.analysis.seq) return;
    const r = localAnalyze(pieces, stm);
    if(seq !== AppState.analysis.seq) return;
    if(!r.top.length){
      evalText.textContent = (stm==='w'?'紅方':'黑方')+'無合法著法（已被將死）';
      document.getElementById('bestMoves').innerHTML='';
      return;
    }
    const top3 = r.top.map(s=>({from:[s.m.fc,s.m.fr], to:[s.m.tc,s.m.tr], score:s.score}));
    /* 供 AI 教練比對：記住此局面所有根著法評分與首選記譜 */
    if(AppState.rec.on && r.all && r.all.length){
      const bm = r.all[0].m;
      const bp = pieces.find(p=>p.col===bm.fc && p.row===bm.fr);
      AppState.analysis.lastRoot = {
        ply: movesArr.length, stm, rootScore: r.best,
        all: r.all,
        topNotation: bp ? genNotation(pieces, bp, [bm.fc,bm.fr], [bm.tc,bm.tr]) : ''
      };
    }
    renderAnalysis(pieces, stm, r.best, top3, '內建引擎');
    if(AppState.engine.state==='ready') tryPikafishAnalysis(pieces, stm, seq);   // 已啟用 Pikafish → 用真實引擎升級
    else tryCloudAnalysis(pieces, stm, seq);                         // 否則背景嘗試雲庫
  }, 30);
}

/* Pikafish WASM 分析（最高優先，含深度與 PV 中文主變化） */
async function tryPikafishAnalysis(pieces, stm, seq){
  try{
    const movetime = (AppState.nav.playTimer ? 700 : 1400);   // 自動播放時縮短思考
    const r = await pfAnalyze(pieces, stm, movetime);
    if(seq !== AppState.analysis.seq || !r) return;
    /* 供教練比對：把 Pikafish top 著法寫入 AppState.analysis.lastRoot */
    if(AppState.rec.on && r.top3.length){
      const bm=r.top3[0];
      const bp=pieces.find(p=>p.col===bm.from[0]&&p.row===bm.from[1]);
      AppState.analysis.lastRoot = {
        ply: (AppState.rec.on?AppState.rec.moves.length:AppState.nav.index), stm,
        all: r.top3.map(e=>({m:{fc:e.from[0],fr:e.from[1],tc:e.to[0],tr:e.to[1]}, score:e.score})),
        topNotation: bp ? genNotation(pieces, bp, bm.from, bm.to) : ''
      };
    }
    renderAnalysis(pieces, stm, r.best, r.top3, 'Pikafish 引擎（深度 '+r.depth+'）');
    /* 主變化中文顯示 */
    const pvEl=document.getElementById('pvLine');
    if(pvEl){
      const cn=pfPvToChinese(r.pv, pieces, stm);
      pvEl.style.display = cn.length ? 'block':'none';
      pvEl.innerHTML = cn.length ? '<span style="color:#8Fc8E8;">主變化：</span>'+cn.join('　') : '';
    }
  }catch(e){ /* 失敗保留內建結果 */ }
}

async function tryCloudAnalysis(pieces, stm, seq){
  try{
    const fen = fenFromPosition(pieces, stm);
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 3500);
    const resp = await fetch('https://www.chessdb.cn/chessdb.php?action=queryall&board='+encodeURIComponent(fen), {cache:'no-store', signal:ctrl.signal});
    clearTimeout(timer);
    const text = (await resp.text()).trim();
    if(seq !== AppState.analysis.seq) return;
    if(!text || text.startsWith('invalid') || text==='unknown' || text.startsWith('nobestmove') || text.startsWith('checkmate')) return;
    const entries = text.split('|').map(seg=>{
      const o={};
      seg.split(',').forEach(kv=>{ const i=kv.indexOf(':'); if(i>0) o[kv.slice(0,i)]=kv.slice(i+1); });
      return o;
    }).filter(o=>o.move && o.score!==undefined);
    if(entries.length===0) return;
    const top3 = entries.slice(0,3).map(e=>{
      const {from,to} = uciToCoords(e.move);
      return {from, to, score:parseInt(e.score,10)};
    });
    renderAnalysis(pieces, stm, parseInt(entries[0].score,10), top3, '雲庫（Pikafish 級）');
  }catch(err){ /* 雲庫不可用時保留內建引擎結果 */ }
}

/* ==================== 形勢曲線（勝率圖） ==================== */

function computeEvalCurve(movesArr){
  const key = movesArr.map(m=>m.notation).join(',');
  if(AppState.analysis.curveCache.key===key) return AppState.analysis.curveCache.vals;
  const vals=[];
  for(let i=0;i<=movesArr.length;i++){
    const pieces = computeBoardAt(i, movesArr);
    const side = i%2===0 ? 'r' : 'b';
    const b = buildBoard(pieces);
    const sc = qsearch(b, side, -Infinity, Infinity, 4);
    vals.push(side==='r' ? sc : -sc);   // 統一為紅方視角
  }
  AppState.analysis.curveCache = {key, vals};
  return vals;
}

function renderEvalCurve(movesArr, curIdx){
  const wrap=document.getElementById('evalCurveWrap');
  const svg=document.getElementById('evalCurve');
  if(!wrap||!svg) return;
  if(!movesArr || movesArr.length<1){ wrap.style.display='none'; return; }
  wrap.style.display='block';
  const vals=computeEvalCurve(movesArr);
  const W=300, H=64, mid=H/2;
  const n=vals.length;
  const x=i=> n<=1 ? 0 : (i/(n-1))*W;
  const y=v=> mid - (mid-4)*Math.tanh(v/400);   // 壓縮到 ±(mid-4)

  let area='', line='';
  vals.forEach((v,i)=>{
    const px=x(i).toFixed(1), py=y(v).toFixed(1);
    line += (i===0?'M':'L')+px+' '+py+' ';
  });
  area = 'M0 '+mid+' ' + vals.map((v,i)=>'L'+x(i).toFixed(1)+' '+y(v).toFixed(1)+' ').join('') + 'L'+W+' '+mid+' Z';

  const curX = x(Math.max(0, Math.min(curIdx, n-1)));
  const curV = vals[Math.max(0, Math.min(curIdx, n-1))];

  svg.innerHTML =
    '<defs>'+
      '<linearGradient id="cvR" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0%" stop-color="#D6584F" stop-opacity=".55"/><stop offset="100%" stop-color="#D6584F" stop-opacity="0"/>'+
      '</linearGradient>'+
      '<clipPath id="cvTop"><rect x="0" y="0" width="'+W+'" height="'+mid+'"/></clipPath>'+
      '<clipPath id="cvBot"><rect x="0" y="'+mid+'" width="'+W+'" height="'+mid+'"/></clipPath>'+
    '</defs>'+
    '<path d="'+area+'" fill="url(#cvR)" clip-path="url(#cvTop)"/>'+
    '<path d="'+area+'" fill="#E4C874" fill-opacity=".28" clip-path="url(#cvBot)"/>'+
    '<line x1="0" y1="'+mid+'" x2="'+W+'" y2="'+mid+'" stroke="#C9A227" stroke-width="0.6" stroke-dasharray="3 3" opacity=".55"/>'+
    '<path d="'+line+'" fill="none" stroke="#F0D48A" stroke-width="1.4" stroke-linejoin="round"/>'+
    '<line x1="'+curX.toFixed(1)+'" y1="0" x2="'+curX.toFixed(1)+'" y2="'+H+'" stroke="#8FC8E8" stroke-width="1"/>'+
    '<circle cx="'+curX.toFixed(1)+'" cy="'+y(curV).toFixed(1)+'" r="2.6" fill="#8FC8E8"/>';

  const note=document.getElementById('curveNote');
  if(note) note.textContent = '第 '+Math.max(0,Math.min(curIdx,n-1))+' 步　紅方 '+(curV>=0?'+':'')+(curV/100).toFixed(2);

  /* 點擊跳步（僅播放模式；記譜模式不跳） */
  svg.onclick = (ev)=>{
    if(AppState.rec.on) return;
    const rect=svg.getBoundingClientRect();
    const ratio=(ev.clientX-rect.left)/rect.width;
    const target=Math.round(ratio*(n-1));
    AppState.nav.index=Math.max(0, Math.min(target, AppState.nav.moves.length));
    stopPlay();
    renderMovesList();
    renderBoard();
  };
}

/* ==================== 棋譜庫載入（openings/*.json） ====================
   index.json 列出所有棋譜檔。支援兩種格式：
   (1) 開局檔 { "side","category","intro","lines":[{name,desc,tokens|playlistId|videoUrl}] }
   (2) 對局集 { "games":[{side,category,name,tokens}] }
   載入完成後才建立分類選單。                                              */
function ensureCategoryIntro(side, cat, intro){
  const e = ensureCategory(side, cat, intro);
  if(intro) e.intro = intro;          // 覆寫 ensureCategory 的預設說明
  return e;
}
function addLibraryLine(side, cat, line){
  const e = ensureCategory(side, cat);
  if(Array.isArray(line.tokens) && line.tokens.length){
    let moves;
    try{ moves = buildMovesFromNotation(line.tokens); }
    catch(err){ return {ok:false, err:(line.name||'')+'：'+err.message}; }
    e.lines.push({name:line.name, desc:line.desc||'', moves});
  } else {
    const o = {name:line.name, desc:line.desc||'', moves:[]};
    if(line.playlistId) o.playlistId = line.playlistId;
    if(line.videoUrl)   o.videoUrl   = line.videoUrl;
    e.lines.push(o);
  }
  return {ok:true};
}

async function loadOpeningLibrary(){
  const note = document.getElementById('extLibNote');
  const show = (txt, bad)=>{
    if(!note) return;
    note.style.display='block';
    note.textContent = txt;
    if(bad){
      note.style.background='rgba(160,60,40,.18)';
      note.style.borderColor='rgba(224,110,90,.45)';
      note.style.color='#FFC0B0';
    }
  };
  try{
    let files, getFile;
    if(window.__EMBEDDED_OPENINGS){          // 離線單檔版：棋庫已內嵌
      const emb = window.__EMBEDDED_OPENINGS;
      files = Object.keys(emb).filter(k=>k!=='index.json');
      getFile = async (f)=> emb[f];
    } else {
      if(location.protocol==='file:'){
        show('⚠ 精簡版需以 http(s) 開啟才能載入 openings/ 棋庫。若要離線使用，請改用單檔版。', true);
        return;
      }
      /* 逐檔取用並回報具體問題，方便辨認是哪一個檔案出錯 */
      const grab = async (path)=>{
        const r = await fetch(path, {cache:'no-store'});
        if(!r.ok) throw new Error(path+'：伺服器回應 '+r.status+(r.status===404?'（檔案不存在）':''));
        const txt = (await r.text()).trim();
        if(!txt) throw new Error(path+'：檔案是空的（可能建立後未貼上內容，或上傳中斷）');
        if(txt[0]==='<') throw new Error(path+'：收到的是網頁而非 JSON（路徑可能不正確）');
        try{ return JSON.parse(txt); }
        catch(e){ throw new Error(path+'：JSON 格式有誤 — '+e.message); }
      };
      files = await grab('openings/index.json');
      if(!Array.isArray(files)) throw new Error('openings/index.json 必須是檔名陣列，例如 ["01-a.json","02-b.json"]');
      if(!files.length) throw new Error('openings/index.json 是空陣列，沒有列出任何棋譜檔');
      getFile = (f)=> grab('openings/'+f);
    }

    const results = await Promise.all(files.map(async f=>{
      try{ return {file:f, data: await getFile(f)}; }
      catch(e){ return {file:f, err:e.message}; }
    }));

    let nCat=0, nLine=0; const problems=[];
    for(const res of results){
      if(res.err){ problems.push(res.file+'（'+res.err+'）'); continue; }
      const d = res.data;
      if(d && d.category && Array.isArray(d.lines)){          // 開局檔
        ensureCategoryIntro(d.side||'先手', d.category, d.intro);
        nCat++;
        for(const ln of d.lines){
          const r = addLibraryLine(d.side||'先手', d.category, ln);
          if(r.ok) nLine++; else problems.push(res.file+' → '+r.err);
        }
      } else if(d && Array.isArray(d.masters)){                // 大師對局檔
        for(const g of d.masters){
          const r = addMasterGame(g, false);
          if(r.ok) nLine++; else problems.push(res.file+' → '+(r.err||'格式不符'));
        }
      } else {                                                 // 對局集
        const games = Array.isArray(d) ? d : (d && d.games) || [];
        for(const g of games){
          if(!g || !g.side || !g.category || !Array.isArray(g.tokens)){ problems.push(res.file+'：格式不符'); continue; }
          const r = addImportedGame(g.side, g.category, g.name || '外部棋譜', g.tokens, false);
          if(r.ok) nLine++; else problems.push(res.file+' → '+r.err);
        }
      }
    }

    if(nLine===0){
      throw new Error('沒有成功載入任何棋譜'+
        (problems.length ? '。問題檔案：' + problems.slice(0,3).join('；') +
          (problems.length>3 ? ('（另有 '+(problems.length-3)+' 項）') : '') : ''));
    }

    populateCategories();
    if(typeof refreshImportCategoryOptions==='function') refreshImportCategoryOptions();
    show('📚 已載入 '+nCat+' 個開局、'+nLine+' 個條目'+(problems.length ? '（'+problems.length+' 項有問題）' : ''));
    if(problems.length) console.warn('棋庫載入問題：', problems);
  }catch(e){
    show('⚠ 棋譜庫載入失敗：'+e.message+
         '<br>若不想維護 openings/ 資料夾，可改用「離線單檔版」——棋譜已內嵌，不需任何額外檔案。', true);
    console.error('loadOpeningLibrary:', e);
  }
}

/* ==================== 大師棋庫（對局後設資料 + 搜尋） ====================
   對局來源檔格式（放 openings/，並在 index.json 列出）：
   { "masters":[ { "red":"王天一", "black":"鄭惟桐", "event":"全國個人賽",
                   "date":"2026-05-12", "result":"紅勝",
                   "category":"中砲對屏風馬", "side":"先手",
                   "tokens":["炮二平五","馬8進7", ...] } ] }
   本程式不內附大師對局資料——請自行從合法來源取得後放入。            */

function addMasterGame(g, refresh){
  if(!g || !Array.isArray(g.tokens) || g.tokens.length<2) return {ok:false, err:'缺少著法'};
  const side = g.side || '先手';
  const cat  = g.category || '大師對局';
  const label = (g.red||'紅方')+' 先勝負 '+(g.black||'黑方');
  const name = (g.red||'?')+' vs '+(g.black||'?')
             + (g.event?('・'+g.event):'')
             + (g.date?('・'+String(g.date).slice(0,10)):'')
             + (g.result?('・'+g.result):'');
  const r = addImportedGame(side, cat, name, g.tokens, false);
  if(!r.ok) return r;
  const entry = DATA[side][cat];
  /* 以實際對局資訊取代匯入功能的罐頭說明 */
  const line = entry.lines[entry.lines.length-1];
  if(line){
    line.desc = '紅方 '+(g.red||'？')+'　黑方 '+(g.black||'？')
      + (g.result?('　結果 '+g.result):'')
      + (g.event?('<br>賽事：'+g.event):'')
      + (g.round?('・'+g.round):'')
      + (g.date?('　'+String(g.date).slice(0,10)):'')
      + '<br>共 '+g.tokens.length+' 步（'+Math.ceil(g.tokens.length/2)+' 回合）';
  }
  entry.intro = '🏆 大師對局・'+cat+'　收錄 '+(entry.lines.length)+' 局';
  AppState.library.masters.push({
    red:g.red||'', black:g.black||'', event:g.event||'', date:String(g.date||''),
    result:g.result||'', side, cat, name, lineIdx: entry.lines.length-1,
    plies: g.tokens.length
  });
  AppState.library.masterCats[side+'|'+cat] = true;   // 標記為大師棋庫分類
  if(refresh!==false){                                // 批次載入時可延後統一更新
    AppState.library.masterRaw.push({red:g.red||'', black:g.black||'', event:g.event||'',
      date:String(g.date||''), result:g.result||'', side, category:cat, tokens:g.tokens.slice()});
    persistMasters();
    populateCategories();
    if(typeof refreshImportCategoryOptions==='function') refreshImportCategoryOptions();
  }
  return {ok:true};
}

const T2S_MAP = (()=>{
  const m = {};
  for(let i=0; i<T2S_PAIRS.length; i+=2) m[T2S_PAIRS[i]] = T2S_PAIRS[i+1];
  return m;
})();
function normCJK(str){
  let out='';
  for(const ch of String(str||'')) out += (T2S_MAP[ch] || ch);
  return out.toLowerCase();
}

function searchMasterGames(q){
  const s = normCJK(String(q||'').trim());
  if(!s) return AppState.library.masters.slice(0, 60);
  const terms = s.split(/\s+/).filter(Boolean);
  return AppState.library.masters.filter(g=>{
    const hay = normCJK(g.red+' '+g.black+' '+g.event+' '+g.date+' '+g.result+' '+g.cat);
    return terms.every(t=>hay.includes(t));
  }).slice(0, 60);
}

/* 依實際收錄的資料產生快速篩選鈕（棋手、賽事分類） */
function renderMasterQuickFilters(){
  const box=document.getElementById('mstQuick');
  if(!box) return;
  box.innerHTML='';
  const games=AppState.library.masters;
  if(!games.length) return;
  /* 以繁簡正規化後的字串歸戶；顯示時在各變體中優先採用繁體寫法 */
  const count=(arr)=>{
    const m={};
    arr.forEach(k=>{ if(!k) return; const key=normCJK(k);
      if(!m[key]) m[key]={label:k, n:0};
      else if(normCJK(k)!==k && normCJK(m[key].label)===m[key].label) m[key].label=k;
      m[key].n++; });
    return m;
  };
  const players=count(games.flatMap(g=>[g.red,g.black]));
  const cats=count(games.map(g=>g.cat));
  const chip=(text,n,q,color)=>{
    const b=document.createElement('button');
    b.textContent=text+'（'+n+'）';
    b.style.cssText='background:'+color+'22;color:'+color+';border:1px solid '+color+'66;'+
      'border-radius:12px;padding:3px 10px;font-size:.68rem;cursor:pointer;font-family:inherit;';
    b.addEventListener('click', ()=>{
      document.getElementById('mstQuery').value=q;
      renderMasterResults(searchMasterGames(q));
    });
    box.appendChild(b);
  };
  Object.keys(cats).sort((a,b)=>cats[b].n-cats[a].n).slice(0,6)
    .forEach(k=>chip(cats[k].label, cats[k].n, cats[k].label, '#8FC8E8'));
  Object.keys(players).sort((a,b)=>players[b].n-players[a].n).slice(0,8)
    .forEach(k=>chip(players[k].label, players[k].n, players[k].label, '#E8CD7A'));
}

      try{ window.speechSynthesis.cancel(); }catch(e){}

/* ==================== Pikafish / Fairy-Stockfish WASM 引擎 ==================== */
/* 座標: 引擎 file a-i = col 0-8; rank 1-10, 紅底線=rank1 → row = 10 - rank        */
/* （注意與 chessdb 的 rank 0-9 差 1，故此處與 uciToCoords 分開）                    */
AppState.engine = {
  engine:null, state:'idle',   // idle | loading | ready | failed | unsupported
  wasmBase:'https://cdn.jsdelivr.net/npm/fairy-stockfish-nnue.wasm@1.1.11/',
  listeners:[], seq:0
};
function pfMoveToCoords(mv){
  const a = mv.match(/^([a-i])(\d+)([a-i])(\d+)$/);
  return {from:[a[1].charCodeAt(0)-97, 10-parseInt(a[2],10)], to:[a[3].charCodeAt(0)-97, 10-parseInt(a[4],10)]};
}
function coordsToPfMove(from,to){
  const L='abcdefghi';
  return L[from[0]]+(10-from[1])+L[to[0]]+(10-to[1]);
}
function pfSend(cmd){ if(AppState.engine.engine) AppState.engine.engine.postMessage(cmd); }

/* 判斷目前環境為何無法跨來源隔離，回傳原因代碼供 UI 說明 */
function pfIsolationStatus(){
  if(self.crossOriginIsolated) return 'ok';
  if(location.protocol==='file:') return 'file';            // 本機雙擊開啟：SW 不可用
  if(!('serviceWorker' in navigator)) return 'nosw';
  if(navigator.serviceWorker.controller) return 'reload';   // 已有 SW 接管，重整一次即可隔離
  return 'noheaders';                                       // 缺 COOP/COEP 且未附 coi-serviceworker.js
}

async function pfEnsureCrossOriginIsolated(){
  if(self.crossOriginIsolated) return true;
  /* 跨來源隔離只能由伺服器標頭或「同源」的 coi-serviceworker.js 取得。         */
  /* 瀏覽器不允許以 blob:／跨網域腳本註冊 Service Worker，故此處不再嘗試註冊， */
  /* 改由部署包中的同源 coi-serviceworker.js 於頁面載入時自動處理。             */
  return false;
}

async function pfLoad(){
  if(AppState.engine.state==='loading' || AppState.engine.state==='ready') return AppState.engine.state==='ready';
  AppState.engine.state='loading'; pfUpdateUI();
  try{
    if(typeof SharedArrayBuffer==='undefined' || !self.crossOriginIsolated){
      const ok = await pfEnsureCrossOriginIsolated();
      if(!ok){ AppState.engine.state='unsupported'; pfUpdateUI(); return false; }
    }
    const [jsText, wasmBuf, workerText] = await Promise.all([
      fetch(AppState.engine.wasmBase+'stockfish.js').then(r=>r.text()),
      fetch(AppState.engine.wasmBase+'stockfish.wasm').then(r=>r.arrayBuffer()),
      fetch(AppState.engine.wasmBase+'stockfish.worker.js').then(r=>r.text())
    ]);
    const workerBlobUrl = URL.createObjectURL(new Blob([workerText], {type:'text/javascript'}));
    const jsBlobUrl = URL.createObjectURL(new Blob([jsText], {type:'text/javascript'}));
    const mod = await import(jsBlobUrl);
    const Stockfish = mod.default;
    AppState.engine.engine = await Stockfish({
      wasmBinary: new Uint8Array(wasmBuf),
      locateFile: (f)=> f.endsWith('.worker.js') ? workerBlobUrl : f,
      mainScriptUrlOrBlob: jsBlobUrl
    });
    AppState.engine.engine.addMessageListener(line=>{ AppState.engine.listeners.forEach(fn=>fn(line)); });
    await pfCommand('uci', l=>l==='uciok', 4000);
    pfSend('setoption name UCI_Variant value xiangqi');
    pfSend('setoption name MultiPV value 3');
    pfSend('setoption name Threads value 1');
    pfSend('isready');
    AppState.engine.state='ready'; pfUpdateUI();
    return true;
  }catch(e){
    console.warn('Pikafish WASM 載入失敗:', e);
    AppState.engine.state='failed'; pfUpdateUI();
    return false;
  }
}

function pfCommand(cmd, until, timeoutMs){
  return new Promise((resolve)=>{
    const lines=[];
    const fn=(l)=>{ lines.push(l); if(until(l)){ done(); } };
    let t=setTimeout(done, timeoutMs||5000);
    function done(){ clearTimeout(t); AppState.engine.listeners=AppState.engine.listeners.filter(x=>x!==fn); resolve(lines); }
    AppState.engine.listeners.push(fn);
    if(cmd) pfSend(cmd);
  });
}

function pfAnalyze(pieces, stm, movetimeMs){
  return new Promise((resolve)=>{
    const mySeq = ++AppState.engine.seq;
    const fen = fenFromPosition(pieces, stm);
    const multipv = {};
    let finished=false;
    const fn=(line)=>{
      if(mySeq!==AppState.engine.seq) return;
      if(line.startsWith('info') && line.includes(' multipv ') && line.includes(' pv ')){
        const dep=(line.match(/ depth (\d+)/)||[])[1];
        const idx=parseInt((line.match(/ multipv (\d+)/)||[])[1],10);
        const cp=(line.match(/ score cp (-?\d+)/)||[])[1];
        const mate=(line.match(/ score mate (-?\d+)/)||[])[1];
        const pv=(line.match(/ pv (.+)$/)||[])[1];
        if(idx && pv){
          let sc; if(mate!==undefined) sc = (+mate>0? 30000-(+mate) : -30000-(+mate)); else sc=parseInt(cp,10);
          multipv[idx]={depth:+dep, score:sc, first:pv.trim().split(/\s+/)[0], pv:pv.trim()};
        }
      } else if(line.startsWith('bestmove')){ finish(); }
    };
    function finish(){
      if(finished) return; finished=true;
      AppState.engine.listeners=AppState.engine.listeners.filter(x=>x!==fn);
      const arr=Object.keys(multipv).sort((a,b)=>a-b).map(k=>multipv[k]);
      if(!arr.length){ resolve(null); return; }
      const top3=arr.slice(0,3).map(e=>{ const c=pfMoveToCoords(e.first); return {from:c.from, to:c.to, score:e.score}; });
      resolve({best:arr[0].score, top3, depth:arr[0].depth, pv:arr[0].pv});
    }
    AppState.engine.listeners.push(fn);
    pfSend('position fen '+fen);
    pfSend('go movetime '+(movetimeMs||1200));
    setTimeout(finish, (movetimeMs||1200)+2500);
  });
}

function pfPvToChinese(pv, startPieces, stm){
  const alive = startPieces.map(p=>({...p, alive:true}));
  const toks = pv.split(/\s+/).slice(0, 12);
  const out=[];
  for(const uci of toks){
    const {from,to} = pfMoveToCoords(uci);
    const mover = alive.find(p=>p.alive && p.col===from[0] && p.row===from[1]);
    if(!mover) break;
    out.push(genNotation(alive.filter(p=>p.alive), mover, from, to));
    const cap = alive.find(p=>p.alive && p.col===to[0] && p.row===to[1] && p!==mover);
    if(cap) cap.alive=false;
    mover.col=to[0]; mover.row=to[1];
  }
  return out;
}

/* ---------- 匯出棋譜 ---------- */
function exportAs(fmt){
  const movesArr = AppState.rec.on ? AppState.rec.moves : AppState.nav.moves;
  if(fmt==='fen'){
    const upto = AppState.rec.on ? AppState.rec.moves.length : AppState.nav.index;
    const pieces = computeBoardAt(upto, movesArr);
    return fenFromPosition(pieces, upto%2===0?'w':'b');
  }
  if(!movesArr.length) return '（目前沒有可匯出的著法）';
  if(fmt==='cn'){
    let out='';
    for(let i=0;i<movesArr.length;i+=2){
      out += (i/2+1)+'. '+movesArr[i].notation+(movesArr[i+1]?' '+movesArr[i+1].notation:'')+'\n';
    }
    return out.trim();
  }
  if(fmt==='iccs'){
    const L='abcdefghi';
    return movesArr.map((m,i)=>{
      const s=L[m.from[0]]+(9-m.from[1])+L[m.to[0]]+(9-m.to[1]);
      return (i%2===0? Math.floor(i/2)+1+'. ' : '')+s;
    }).join(' ');
  }
  if(fmt==='wxf'){
    /* 重播局面以決定檔線與前後標記 */
    const pieces = initialPieces().map(p=>({...p,alive:true}));
    const CAT2L={R:'R',H:'H',C:'C',E:'E',A:'A',K:'K',P:'P'};
    const toks=[];
    movesArr.forEach((mv,i)=>{
      const side = i%2===0?'r':'b';
      const alive=pieces.filter(p=>p.alive);
      const mover=alive.find(p=>p.col===mv.from[0]&&p.row===mv.from[1]);
      if(!mover){ toks.push('????'); return; }
      const cat=pieceCategory(mover.type);
      let L=CAT2L[cat]; if(side==='b') L=L.toLowerCase();
      const file = side==='r' ? 9-mv.from[0] : mv.from[0]+1;
      const dRow = mv.to[1]-mv.from[1];
      const fwd = side==='r' ? -1 : 1;
      let act, num;
      if(dRow===0){ act='.'; num = side==='r' ? 9-mv.to[0] : mv.to[0]+1; }
      else{
        act = (dRow*fwd>0) ? '+' : '-';
        if(cat==='R'||cat==='C'||cat==='K'||cat==='P') num=Math.abs(dRow);
        else num = side==='r' ? 9-mv.to[0] : mv.to[0]+1;
      }
      /* 同檔同種雙子 → 用 +/- 前後標記取代檔線 */
      const twins = alive.filter(p=>p!==mover && p.side===side && pieceCategory(p.type)===cat && p.col===mv.from[0]);
      let tok;
      if(twins.length>0 && cat!=='E' && cat!=='A'){
        const isFront = twins.every(t=> side==='r' ? mover.row < t.row : mover.row > t.row);
        tok = (isFront?'+':'-')+L+act+num;
      } else {
        tok = L+file+act+num;
      }
      toks.push(tok);
      const cap=alive.find(p=>p.col===mv.to[0]&&p.row===mv.to[1]&&p!==mover);
      if(cap)cap.alive=false;
      mover.col=mv.to[0]; mover.row=mv.to[1];
    });
    let out='';
    for(let i=0;i<toks.length;i+=2){
      out += (i/2+1)+'. '+toks[i]+(toks[i+1]?' '+toks[i+1]:'')+'\n';
    }
    return out.trim();
  }
  if(fmt==='json'){
    return JSON.stringify({
      name: AppState.rec.on ? '記譜局' : '棋譜',
      exported: new Date().toISOString().slice(0,10),
      tokens: movesArr.map(m=>m.notation)
    }, null, 2);
  }
  return '';
}

/* ==================== 儲存記譜 ==================== */
function classifyForSave(tokens, preferSide){
  const notas = tokens.map(normalizeNotation);
  const exact = matchKnownLines(notas);
  const heur = classifyOpening(notas).filter(h=>!h.cat.includes('總清單'));
  // 候選池：深度精確吻合 > 開局特徵 > 淺層吻合
  // 深度門檻＝前 10 步（棋譜不足 10 步時以全長吻合為準），提高比對精確度
  const deepTh = Math.min(10, notas.length);
  const deep = exact.filter(r=>r.score>=deepTh);
  const pool = [...deep, ...heur, ...exact];
  const seen = new Set();
  const uniq = pool.filter(r=>{ const k=r.side+'|'+r.cat; if(seen.has(k))return false; seen.add(k); return true; });
  return uniq.find(r=>r.side===preferSide) || uniq[0] || null;
}

document.getElementById('btnSaveRec').addEventListener('click', ()=>{
  const box = document.getElementById('searchResults');
  box.innerHTML='';
  box.classList.add('show');
  if(!AppState.rec.on){
    box.innerHTML='<div class="sr-empty">請先用「先手記譜」或「後手記譜」記錄棋局，再按儲存。</div>';
    return;
  }
  if(AppState.rec.moves.length<2){
    box.innerHTML='<div class="sr-empty">目前記譜不足2步，請先走幾步再儲存。</div>';
    return;
  }
  const preferSide = AppState.rec.flip ? '後手' : '先手';
  const tokens = AppState.rec.moves.map(m=>m.notation);
  const cls = classifyForSave(tokens, preferSide);
  const side = cls ? cls.side : preferSide;
  const cat  = cls ? cls.cat  : '匯入棋譜（未分類）';
  const why  = cls ? cls.why  : '無法自動判斷開局類型，已放入未分類';
  const rounds = Math.ceil(tokens.length/2);
  const name = (AppState.rec.flip?'後手記譜':'先手記譜')+'（'+rounds+'回合）#'+(AppState.library.imported.length+1);

  /* 同步存一份到「記譜歷史」，方便日後叫出（依記譜方歸屬先/後手） */
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const stamp=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes());
  addImportedGame(preferSide, '記譜歷史', stamp+'　'+name, tokens);

  const r = addImportedGame(side, cat, name, tokens);
  if(!r.ok){
    box.innerHTML='<div class="sr-empty">儲存失敗：'+r.err+'</div>';
    return;
  }
  box.innerHTML='<div class="sr-empty" style="color:#8FD98F;">✔ 已儲存「'+name+'」至 <b style="color:#C9A227;">'+side+'｜'+cat+'</b>（依據：'+why+'）</div>';
  refreshImportCategoryOptions();
  // 清空記譜、結束記譜模式並跳到剛儲存的棋譜
  AppState.rec.moves = [];
  stopRecording();
  box.classList.add('show');   // stopRecording會關閉結果框，重新打開顯示確認訊息
  box.innerHTML='<div class="sr-empty" style="color:#8FD98F;">✔ 已儲存「'+name+'」至 <b style="color:#C9A227;">'+side+'｜'+cat+'</b>（依據：'+why+'）</div>';
  sideSelect.value=side;
  populateCategories();
  const entry=DATA[side][cat];
  selectCategory(cat, entry.lines.length-1);
});
